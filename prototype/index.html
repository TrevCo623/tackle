<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Tackle">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#F7F7F4" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#191917" media="(prefers-color-scheme: dark)">
<title>Tackle Prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gasoek+One&family=Archivo:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Layout: one phone-width column, quiet paper ground, theme color only as small dots; fixed tab bar at the bottom. */
:root {
  --bg: #F7F7F4; --frame: #E7E7E1; --surface: #EFEFEA; --card: #FFFFFF;
  --ink: #1C1C1A; --ink2: #33332F; --text2: #4A4A45; --muted: #5E5E58; --faint: #8A8A83;
  --line: #E4E4DE; --line2: #D6D6CF; --on-ink: #F7F7F4;
  --amber: #B07A1E; --amber-text: #8A5A0E; --link: #3D5A80; --star: #C9962E; --star-line: #8A6418;
  --mon: #6E9274; --tue: #5B7BA6; --wed: #B08A4F; --fri: #9A6F84;
  --c-plan: #5B7BA6; --c-client: #B08A4F; --c-wrap: #9A6F84; --c-own: #6E9274;
  --hero: #000000; --on-hero: #FFFFFF; --hero-line: #000000;
  --tint-mon: #B9D1BC; --tint-tue: #B7C9E2; --tint-wed: #E6CC9E; --tint-fri: #E3C5D3;
  --scrim: rgba(28, 28, 26, 0.38); --shadow: 0 10px 30px rgba(28, 28, 26, 0.16);
  --sans: "Archivo", "Helvetica Neue", Arial, sans-serif;
  --display: "Gasoek One", "Archivo Black", Impact, "Arial Black", sans-serif;
  --mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;
  --system: -apple-system, "SF Pro Text", system-ui, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #191917; --frame: #0F0F0E; --surface: #22221F; --card: #272724;
    --ink: #EDEDE6; --ink2: #DADAD2; --text2: #BDBDB4; --muted: #A5A59B; --faint: #7D7D75;
    --line: #33332F; --line2: #46463F; --on-ink: #191917;
    --amber: #D4A04A; --amber-text: #E0B263; --link: #A3BCDD; --star: #D9A740; --star-line: #E8C374;
    --hero: #000000; --hero-line: #3A3A35; --scrim: rgba(0, 0, 0, 0.55); --shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #191917; --frame: #0F0F0E; --surface: #22221F; --card: #272724;
  --ink: #EDEDE6; --ink2: #DADAD2; --text2: #BDBDB4; --muted: #A5A59B; --faint: #7D7D75;
  --line: #33332F; --line2: #46463F; --on-ink: #191917;
  --amber: #D4A04A; --amber-text: #E0B263; --link: #A3BCDD; --star: #D9A740; --star-line: #E8C374;
  --hero: #000000; --hero-line: #3A3A35; --scrim: rgba(0, 0, 0, 0.55); --shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { height: 100%; }
body { background: var(--frame); color: var(--ink); font-family: var(--sans); -webkit-font-smoothing: antialiased; }
button, input, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }

.shell {
  max-width: 430px; min-height: 100%; margin: 0 auto; background: var(--bg); position: relative;
  padding-left: max(20px, env(safe-area-inset-left, 0px));
  padding-right: max(20px, env(safe-area-inset-right, 0px));
  padding-block: 0 calc(110px + env(safe-area-inset-bottom, 0px));
}
@media (min-width: 470px) { .shell { border-inline: 1px solid var(--line); } }

/* Prototype controls */
.proto {
  margin-top: 12px; padding: 10px 12px; border: 1px dashed var(--line2); border-radius: 12px;
  display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px;
  font-family: var(--mono); font-size: 11px; color: var(--muted); letter-spacing: 0.02em;
}
.proto-tag { text-transform: uppercase; letter-spacing: 0.08em; color: var(--ink2); }
.proto-group { display: flex; align-items: center; gap: 4px; flex-wrap: wrap; }
.proto button {
  min-height: 30px; padding: 0 8px; border-radius: 8px; border: 1px solid var(--line2);
  background: var(--card); font-family: var(--mono); font-size: 11px; color: var(--ink2);
}
.proto button[aria-pressed="true"] { background: var(--ink); border-color: var(--ink); color: var(--on-ink); }
.proto .proto-wide { flex-basis: 100%; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }

/* Screens */
#app { display: flex; flex-direction: column; gap: 26px; padding-top: 28px; }
.eyebrow {
  margin: 0; font-family: var(--mono); font-size: 11.5px; font-weight: 500;
  letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted);
}
.head { display: flex; flex-direction: column; gap: 10px; }
.title-row { display: flex; align-items: center; gap: 12px; }
h1 { margin: 0; font-family: var(--display); font-size: 30px; font-weight: 400; text-transform: uppercase; letter-spacing: 0; line-height: 1.02; text-wrap: balance; }
h2 { margin: 0; font-family: var(--display); font-size: 20px; font-weight: 400; text-transform: uppercase; letter-spacing: 0.01em; }
.lede { margin: 0; font-size: 15px; line-height: 1.6; color: var(--text2); max-width: 36ch; }
.dot { flex-shrink: 0; width: 11px; height: 11px; border-radius: 50%; }
.dot.sm { width: 9px; height: 9px; }
.ticon { display: inline-flex; flex-shrink: 0; color: var(--ink2); }
.targets button[aria-pressed="true"] .ticon { color: var(--on-ink); }

.plan-btn {
  display: flex; align-items: center; justify-content: space-between; gap: 12px; width: 100%;
  padding: 16px 18px; border: 0; border-radius: 14px; background: var(--ink); color: var(--on-ink); text-align: left;
}
.plan-btn strong { display: block; font-size: 16px; font-weight: 500; }
h1.today-title { font-size: 32px; line-height: 1.02; max-width: 11em; }
.head { position: relative; }
.acct-btn { position: absolute; top: -6px; right: 0; width: 36px; height: 36px; border-radius: 50%; border: 1px solid var(--line2); background: var(--surface); color: var(--ink); font-family: var(--mono); font-size: 13px; text-transform: uppercase; display: flex; align-items: center; justify-content: center; }
body.is-gated .tabbar, body.is-gated .fab { display: none; }
.gate { min-height: 76vh; display: flex; flex-direction: column; justify-content: center; align-items: stretch; text-align: center; }
.gate h1 { font-size: 56px; color: #FFFFFF; }
.gate .lede { margin: 22px 0 64px; color: #FFFFFF; font-size: 16px; }
body.is-gated, body.is-gated .shell { background: #1C1C1A; }
.google-btn { border-color: #FFFFFF; }
.google-btn { display: flex; align-items: center; justify-content: center; gap: 10px; min-height: 54px; border-radius: 15px; border: 1px solid var(--line2); background: var(--card); color: var(--ink); font-size: 16px; font-weight: 600; }
.acct-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 14px 0; border-top: 1px solid var(--line); }
.acct-row:first-of-type { border-top: 0; }
.acct-row p { margin: 0; }
.acct-row small { display: block; color: var(--muted); font-size: 13px; margin-top: 2px; }
.acct-row.sub { padding-top: 0; border-top: 0; }
.time-pick select {
  appearance: none; -webkit-appearance: none; min-height: 40px; padding: 0 30px 0 14px; border-radius: 20px;
  border: 1px solid var(--line2); background: var(--surface); font: inherit; font-size: 15px; font-weight: 600; color: var(--ink);
  background-image: linear-gradient(45deg, transparent 50%, var(--muted) 50%), linear-gradient(135deg, var(--muted) 50%, transparent 50%);
  background-position: calc(100% - 16px) 52%, calc(100% - 12px) 52%; background-size: 4px 4px; background-repeat: no-repeat;
}
.switch:disabled { opacity: .45; }
.acct-row .ghost-btn { flex-shrink: 0; min-height: 40px; padding: 0 14px; font-size: 14px; white-space: nowrap; }
#app.is-wrap { gap: 30px; }

.chips { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; padding-bottom: 2px; }
.chips::-webkit-scrollbar { display: none; }
.dd-row { display: flex; flex-wrap: wrap; gap: 8px; }
.week-tools:has(.dd) { justify-content: space-between; align-items: center; margin: 0 0 -6px; }
label.dd { position: relative; display: inline-flex; flex-direction: row; margin: 0; align-items: center; gap: 7px; min-height: 36px; padding: 0 12px 0 14px; border-radius: 18px;
  background: var(--card); font-size: 14px; color: var(--ink); }
label.dd.is-set { background: var(--ink); color: var(--on-ink); }
.dd .ico { display: inline-flex; } .dd .ico svg { width: 15px; height: 15px; }
.dd .caret { display: inline-flex; transform: rotate(90deg); opacity: .6; } .dd .caret svg { width: 14px; height: 14px; }
.dd select { position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0; font-size: 16px; cursor: pointer; -webkit-appearance: none; appearance: none; }
.dd:focus-within { outline: 2px solid var(--ink); outline-offset: 2px; }
.chip {
  flex-shrink: 0; min-height: 36px; padding: 0 14px; border-radius: 18px;
  border: 1px solid transparent; background: var(--card); font-size: 14px; color: var(--ink);
}
.chip[aria-pressed="true"] { background: var(--ink); border-color: var(--ink); color: var(--on-ink); }

.section { display: flex; flex-direction: column; }
.section > .eyebrow { margin-bottom: 8px; }

.row { display: flex; align-items: center; gap: 12px; min-height: 58px; border-bottom: 1px solid var(--line); }
.row .status {
  flex-shrink: 0; width: 44px; height: 44px; margin-left: -11px; border: 0; background: transparent;
  display: flex; align-items: center; justify-content: center; padding: 0;
}
.st-todo .status { color: var(--faint); }
.st-doing .status { color: var(--amber); }
.st-done .status { color: var(--ink); }
.ck { stroke: var(--bg); }
.row-main {
  flex: 1; min-width: 0; border: 0; background: transparent; padding: 9px 0; text-align: left;
  display: flex; flex-direction: column; gap: 4px;
}
.row-label { font-size: 16px; line-height: 1.35; color: var(--ink); }
.st-done .row-label { color: var(--muted); text-decoration: line-through; }
.row-meta { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; font-size: 12.5px; color: var(--muted); }
.row-meta .flag { color: var(--amber-text); }
.row-meta .rep { display: inline-flex; align-items: center; gap: 3px; }
.row-meta svg { width: 11px; height: 11px; }
.row-meta.dep { flex-wrap: nowrap; min-width: 0; }
.row-meta.dep > :not(.dep-on) { flex-shrink: 0; white-space: nowrap; }
.row-meta .dep-on { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pglyph { display: inline-flex; align-items: center; color: var(--ink2); }
.pglyph svg { width: 13px; height: 13px; }
.row-meta > * + *::before { content: "·"; margin-right: 6px; color: var(--faint); }
.row-meta > .pglyph + *::before { content: none; }
.row .more { margin-right: -10px; }
.waiting-icon.status { color: var(--faint); }
.status-opts { display: flex; flex-direction: column; gap: 8px; }
.status-opt {
  display: flex; align-items: center; gap: 14px; min-height: 58px; padding: 0 16px; border-radius: 14px;
  border: 1px solid transparent; background: var(--card); font-size: 16px; color: var(--ink); text-align: left;
}
.status-opt[aria-pressed="true"] { border: 1.5px solid var(--ink); font-weight: 600; }
.status-ico { display: inline-flex; }
.status-opt.st-todo .status-ico { color: var(--faint); }
.status-opt.st-doing .status-ico { color: var(--amber); }
.status-opt.st-done .status-ico { color: var(--ink); }
.waiting-icon { flex-shrink: 0; width: 22px; display: flex; justify-content: center; color: var(--faint); }
.dep { color: var(--text2); }
.dep b { font-weight: 600; color: var(--ink2); }

/* Project icon tile */
.ptile {
  flex-shrink: 0; width: 30px; height: 30px; border-radius: 9px; background: var(--surface); border: 1px solid transparent;
  display: inline-flex; align-items: center; justify-content: center; color: var(--ink2);
}
.ptile svg { width: 17px; height: 17px; }
.ptile.sm { width: 24px; height: 24px; border-radius: 7px; }
.ptile.sm svg { width: 14px; height: 14px; }
.chip .ico, .tchip .ico { display: inline-flex; }
.chip .ico svg { width: 15px; height: 15px; }
.chip { display: inline-flex; align-items: center; gap: 7px; }
.chip.add { border-style: dashed; border-color: var(--line2); color: var(--text2); background: transparent; }
.icon-grid { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 8px; }
.icon-grid button {
  aspect-ratio: 1; max-width: 100%; border-radius: 12px; border: 1px solid transparent; background: var(--card);
  display: flex; align-items: center; justify-content: center; color: var(--ink2);
}
.icon-grid button svg { width: 22px; height: 22px; }
.icon-grid button[aria-pressed="true"] { background: var(--ink); border-color: var(--ink); color: var(--on-ink); }
.preview-chip { display: flex; align-items: center; gap: 10px; font-size: 15px; color: var(--text2); }

.quiet-note { margin: 10px 0 0; font-size: 14px; line-height: 1.55; color: var(--muted); }
.text-btn {
  align-self: flex-start; min-height: 44px; padding: 0; border: 0; background: transparent;
  font-size: 14px; color: var(--muted); text-decoration: underline; text-underline-offset: 3px;
}
.text-btn.danger { color: #A3402F; }
:root[data-theme="dark"] .text-btn.danger { color: #E0907F; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .text-btn.danger { color: #E0907F; } }

.next-card {
  display: flex; flex-direction: column; gap: 6px; padding: 18px; border-radius: 14px; background: var(--surface);
}
.next-card p { margin: 0; font-size: 15px; color: var(--text2); }

/* Week */
.week-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; }
.legend { display: flex; align-items: center; gap: 6px; margin-bottom: 5px; font-size: 13px; color: var(--muted); }
.days { position: relative; display: flex; flex-direction: column; gap: 12px; }
.day {
  display: flex; flex-direction: column; gap: 10px; padding: 14px; border-radius: 16px;
  background: var(--surface); border: 1.5px solid transparent;
}
.day.is-today { border-color: var(--ink); }
/* Days already behind us: still readable, no longer asking for attention. */
.day.is-past { background: color-mix(in srgb, var(--surface) 55%, transparent); }
.day.is-past > * { opacity: .5; }
.day.off-col { padding: 2px 4px; background: transparent; border: 0; }
.day-toggle {
  display: flex; flex-direction: column; gap: 8px; width: 100%; min-height: 44px; padding: 0; border: 0;
  background: transparent; text-align: left; color: inherit;
}
.day-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; width: 100%; }
.day-right { display: flex; align-items: center; gap: 6px; flex-shrink: 0; }
.chev-day { display: inline-flex; color: var(--muted); transition: transform 0.15s; }
.day.is-open .chev-day { transform: rotate(90deg); }
.day-sum { display: flex; align-items: center; gap: 10px; padding-left: 26px; margin-top: -2px; } /* lines up with the day name, past the theme icon */
.day-sum-text { font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
.day-sum-icons { display: flex; gap: 4px; flex-shrink: 0; }
.day-sum-icons .ptile { background: var(--card); }
.more-n { font-size: 12px; color: var(--muted); align-self: center; }
.day-body { display: flex; flex-direction: column; gap: 10px; }
.week-tools { display: flex; justify-content: flex-end; margin: -14px 0 -10px; }
.week-tools .text-btn { min-height: 36px; font-size: 13.5px; }
.day-name { display: flex; flex-direction: row; flex-wrap: wrap; align-items: baseline; column-gap: 8px; row-gap: 2px; min-width: 0; }
.day-name > span:first-child { display: flex; align-items: baseline; gap: 8px; }
.day-name > span:first-child > .ticon { align-self: center; }
.day-name strong { font-size: 17px; font-weight: 600; }
.day-name small { font-size: 13.5px; color: var(--text2); }
.day-date { font-family: var(--mono); font-size: 11px; color: var(--muted); letter-spacing: 0.04em; text-transform: uppercase; }
.wcards { display: flex; flex-direction: column; gap: 6px; }
.wcard {
  display: flex; align-items: center; gap: 4px; min-height: 52px; padding-left: 10px; border-radius: 12px;
  background: var(--card); border: 1px solid transparent;
}
.wcard.moved { border-style: dashed; border-color: var(--faint); }
.wcard[data-drag] { -webkit-touch-callout: none; -webkit-user-select: none; user-select: none; transition: transform .15s, box-shadow .15s; }
.wcard.is-pressing { transform: scale(.98); }
.wcard.is-dragging { opacity: .3; }
.wcard.is-ghost { position: fixed; z-index: 60; pointer-events: none; margin: 0; transform: scale(1.02) rotate(-1deg); box-shadow: 0 12px 30px rgba(0,0,0,.2); border: 1px solid var(--ink); }
.wcard.drop-before { box-shadow: 0 -3px 0 -1px var(--ink); }
.wcard.drop-after { box-shadow: 0 3px 0 -1px var(--ink); }
[data-zone].is-over { box-shadow: 0 0 0 2px var(--ink); }
body.is-dragging-task { overflow: hidden; touch-action: none; }
.wcard-main {
  flex: 1; min-width: 0; display: flex; align-items: center; gap: 10px; min-height: 50px; padding: 6px 0;
  border: 0; background: transparent; text-align: left;
}
.wcard-text { min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.wcard-text span { font-size: 14.5px; line-height: 1.3; color: var(--ink); }
.wcard-text small { display: flex; align-items: center; gap: 4px; font-size: 11.5px; color: var(--muted); }
.wcard.is-done .wcard-text span { color: var(--muted); text-decoration: line-through; }
.wcard.is-doing .wcard-text small { color: var(--amber-text); }
.more {
  flex-shrink: 0; width: 44px; height: 44px; border: 0; background: transparent; border-radius: 10px;
  display: flex; align-items: center; justify-content: center; color: var(--muted);
}
.menu-list { display: flex; flex-direction: column; border-top: 1px solid var(--line); }
.menu-list button {
  display: flex; align-items: center; gap: 12px; min-height: 52px; border: 0; border-bottom: 1px solid var(--line);
  background: transparent; text-align: left; font-size: 16px; color: var(--ink);
}
.menu-list button.danger { color: #A3402F; }
:root[data-theme="dark"] .menu-list button.danger { color: #E0907F; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .menu-list button.danger { color: #E0907F; } }
.menu-list svg { color: var(--muted); }
.targets button.is-current { border-style: dashed; border-color: var(--line2); }
.pill {
  font-family: var(--mono); font-size: 10.5px; letter-spacing: 0.08em; text-transform: uppercase;
  padding: 3px 8px; border-radius: 10px; background: var(--line); color: var(--ink);
}
.count { font-size: 12.5px; color: var(--muted); }
.tchips { display: flex; flex-wrap: wrap; gap: 6px; }
.tchip {
  display: inline-flex; align-items: center; gap: 6px; min-height: 36px; padding: 0 10px; border-radius: 8px;
  background: var(--card); border: 1px solid transparent; font-size: 13.5px; color: var(--ink2); text-align: left;
}
.tchip.moved { border-style: dashed; border-color: var(--faint); }
.tchip.is-done { color: var(--muted); text-decoration: line-through; }
.tchip small { font-size: 11px; color: var(--muted); text-decoration: none; }
.tchip svg { flex-shrink: 0; color: var(--faint); }
.empty-day { margin: 0; font-size: 13.5px; color: var(--muted); }
.day > .count { margin: 0; padding-left: 2px; }
.off-col .off { padding: 0; }
.back-btn {
  flex-shrink: 0; width: 44px; height: 44px; margin-left: -12px; border: 0; background: transparent;
  display: flex; align-items: center; justify-content: center; color: var(--text2);
}
.menu-list .chev { margin-left: auto; }
.off { margin: 0; padding-left: 4px; font-size: 14px; color: var(--muted); }

/* Wrap */
.hero {
  position: relative; overflow: hidden; display: flex; flex-direction: column; gap: 18px;
  padding: 22px 20px 20px; border-radius: 20px; background: var(--hero); color: var(--on-hero);
}
.hero { gap: 28px; padding: 24px 20px; border: 1px solid var(--hero-line); }
.hero-big { display: flex; align-items: center; gap: 18px; }
.hero-big strong { font-family: var(--display); font-size: 72px; font-weight: 400; letter-spacing: 0; line-height: 1; font-variant-numeric: tabular-nums; }
.hero-big span { font-family: var(--mono); font-size: 17px; font-weight: 500; line-height: 1.3; letter-spacing: 0.06em; text-transform: uppercase; }
.tally { margin: 0; padding: 0; list-style: none; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px 36px; }
.tally li { display: flex; align-items: center; gap: 8px; min-width: 0; }
.tally-ico {

/* Wrap flow */

}

.day-pick select {
  appearance: none; -webkit-appearance: none; width: 76px; min-height: 36px; padding: 0 26px 0 12px; border-radius: 18px;
  border: 1px solid var(--line2); background: var(--surface); font: inherit; font-size: 14px; font-weight: 600; color: var(--ink);
  background-image: linear-gradient(45deg, transparent 50%, var(--muted) 50%), linear-gradient(135deg, var(--muted) 50%, transparent 50%);

.acct-page > :first-child { border-top: 1px solid var(--line); }

.rhythm-row { align-items: flex-start; padding-block: 16px; }

.rm-day { font-family: var(--mono); font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }

.sub-back { position: static; align-self: flex-start; margin: 0 0 6px; }

.theme-list { display: flex; flex-direction: column; border-top: 1px solid var(--line); }

/* Status slider */
.slider {
  --pos: 0; --pill: var(--ink); --pill-ink: var(--on-ink); position: relative; height: 82px; border-radius: 18px; background: var(--surface);
  border: 1px solid transparent; touch-action: none; user-select: none; -webkit-user-select: none; cursor: grab;
}
.slider:focus-visible { outline: 2px solid var(--ink); outline-offset: 3px; }
.slider-stops { position: absolute; inset: 0 4px; z-index: 1; display: grid; grid-template-columns: repeat(3, 1fr); align-items: center; text-align: center; font-size: 14px; font-weight: 500; color: var(--text2); pointer-events: none; }
/* The labels never move: a second, light copy is clipped to the black pill, so as the pill slides
   behind them each label turns light where the pill is under it. */
/* Pill colors come from the palette: amber is the In progress icon color, sage the palette green. */
.slider[data-st="doing"] { --pill: var(--amber); --pill-ink: #FFFFFF; }
.slider[data-st="done"] { --pill: var(--mon); --pill-ink: #FFFFFF; }
.slider-stops.on { color: var(--pill-ink); transition: clip-path 0.22s ease-out, color 0.22s ease-out;
  clip-path: inset(5px calc(100% - 4px - (100% - 8px) * (var(--pos) + 1) / 3) 5px calc(4px + (100% - 8px) * var(--pos) / 3) round 14px);
  inset: 0; padding: 0 4px; }
.slider-stops.on .stop-ico { color: var(--pill-ink); }
.slider-stops.on .ck { stroke: var(--pill); }
.slider.dragging .slider-stops.on { transition: none; }
.slider-stops > span { display: flex; flex-direction: column; align-items: center; gap: 6px; }
.stop-ico { display: inline-flex; color: var(--muted); }
.slider-thumb {
  position: absolute; top: 5px; bottom: 5px; width: calc((100% - 8px) / 3); left: calc(4px + (100% - 8px) / 3 * var(--pos));
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; border-radius: 14px;
  background: var(--pill); color: var(--pill-ink); font-size: 14px; font-weight: 600; box-shadow: 0 3px 10px rgba(0, 0, 0, 0.18);
  transition: left 0.22s ease-out, background-color 0.22s ease-out;
}
.slider.dragging .slider-thumb { transition: none; }
.slider.dragging { cursor: grabbing; }
.slider-thumb .status-ico { display: inline-flex; color: var(--on-ink); }
.slider-thumb .ck { stroke: var(--ink); }
.thumb-label { white-space: nowrap; }
.hold-link { align-self: center; font-size: 13.5px; color: var(--text2); }
.hold-form { display: flex; flex-direction: column; gap: 8px; padding: 14px; border-radius: 14px; background: var(--card); border: 1px solid transparent; }
.hold-btns { display: flex; gap: 8px; justify-content: flex-end; padding-top: 4px; }
.ghost-btn.small, .primary.small { min-height: 44px; width: auto; padding: 0 16px; border-radius: 12px; font-size: 15px; }
.hold-card { display: flex; align-items: center; gap: 12px; padding: 12px 12px 12px 14px; border-radius: 14px; background: var(--card); border: 1px dashed var(--faint); }
.hold-ico { display: inline-flex; color: var(--muted); flex-shrink: 0; }
.hold-card p { flex: 1; min-width: 0; margin: 0; display: flex; flex-direction: column; gap: 3px; font-size: 14.5px; line-height: 1.35; }
.hold-card b { font-weight: 600; }
@media (prefers-reduced-motion: reduce) { .slider-thumb, .slider-stops.on { transition: none; } }


/* Full-page task editor */

  const $ = (s) => document.querySelector(s);

  // Real app: when a new week starts without a Wrap, quietly reset it (forgiving: open work stays on its day).
  function rollWeek() {
    if (!APP) return;
    const cur = isoDay(thisMonday());
    if (!S.weekOf) S.weekOf = cur;
    if (S.weekOf < cur) {
      S.tasks = S.tasks.filter((t) => {
        if (t.status === 'done' && !t.repeat) return false;
        if (t.repeat) t.status = 'todo';
        if (t.home) { t.day = t.home; t.home = null; }
        t.next = false;
        return true;
      });
      if (!S.closed) S.streak = 0;
      S.closed = null; S.carry = {}; S.wrapStep = 1; S.notes = { proud: '', better: '', next: '' }; S.weekOpen = {};
      S.weekOf = cur;
    }

    const ahead = new Date(S.weekOf + 'T00:00:00');
    monday = ahead > thisMonday() ? ahead : thisMonday();
  }
