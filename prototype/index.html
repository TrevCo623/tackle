    const link = where === 'week';
    let h = `<${link ? 'a href="#summary" class="hero hero-link"' : 'section class="hero"'} aria-labelledby="hero-h-${where}">
      <div class="hero-big"><strong>${done.length}</strong><span id="hero-h-${where}">${done.length === 1 ? 'Task' : 'Tasks'} completed<br>this week</span></div>`;
    if (byProject.length) h += '<ul class="tally" aria-label="By project">' + byProject.map((c) => `<li><span class="tally-ico">${picon(c.p.icon, 16)}</span><b>${c.n}</b><small>${esc(c.p.name)}</small></li>`).join('') + '</ul>';
    const foot = where === 'wrap' ? 'Close it out when you’re ready.' : '';
    return h + `${foot ? `<p class="hero-foot">${foot}</p>` : ''}${link ? `<span class="hero-more">See progress${ICON.arrow}</span>` : ''}</${link ? 'a' : 'section'}>`;
  }

  function renderAll() {
    const f = S.filters.all, d = S.allDay;
    const ord = { doing: 0, todo: 1, done: 2 };
    const dayOk = (t) => d === 'All' || (d === 'Next' ? !!t.next : t.day === d && !t.next);
    const key = (t) => (t.next ? 5 : 0) + WEEKDAYS.indexOf(t.day);
    const list = S.tasks.filter((t) => (f === 'All' || t.tag === f) && dayOk(t) && (S.allDone || t.status !== 'done'))
      .sort((a, b) => key(a) - key(b) || ord[a.status] - ord[b.status]);
    const doneN = S.tasks.filter((t) => (f === 'All' || t.tag === f) && dayOk(t) && t.status === 'done').length;
    const openN = S.tasks.filter((t) => (f === 'All' || t.tag === f) && dayOk(t) && t.status !== 'done').length;
    let h = slotHead(`${openN} open ${openN === 1 ? 'task' : 'tasks'}`, '', 'All tasks');
    h += '<div class="dd-row">' + dayDD('all-day', d, true) + projDD('all') + '</div>';
    if (!list.length) h += `<p class="quiet-note">${S.tasks.length ? 'Nothing matches these filters.' : 'No tasks yet. Tap + to add one.'}</p>`;
    // Same rows as Today, one list; the Day filter does the grouping.
    if (list.length) h += '<section class="section" aria-label="Tasks">' + list.map((t) => row(t, '', 'all')).join('') + '</section>';
    if (doneN) h += `<button type="button" class="text-btn" data-act="all-done">${S.allDone ? 'Hide' : 'Show'} ${doneN} done</button>`;
    return h;
  }

  // Settings: account, notifications, your week. The prototype shows stand-in account and nudge rows.
  const NUDGE_TIMES = Array.from({ length: 96 }, (_, i) => String(Math.floor(i / 4)).padStart(2, '0') + ':' + String((i % 4) * 15).padStart(2, '0'));
  const timeLabel = (hm) => { const [h, m] = hm.split(':').map(Number); return (h % 12 || 12) + ':' + String(m).padStart(2, '0') + (h < 12 ? 'am' : 'pm'); };
  function protoNudgeRows() {
    const on = !!S.protoNudge, time = S.nudgeTime || '08:30';
    return `<div class="acct-row"><p><strong id="nudge-l">Daily nudge</strong><small>“What do you want to tackle today?” on your themed days.</small></p>
        <button type="button" class="switch" role="switch" aria-checked="${on}" aria-labelledby="nudge-l" data-act="proto-nudge"></button></div>
      ${on ? `<div class="acct-row sub"><p><strong>Time</strong><small>Your time zone. Free days get nothing.</small></p>
        <label class="time-pick"><span class="sr-only">Nudge time</span><select id="nudge-time">${NUDGE_TIMES.map((t) => `<option value="${t}"${t === time ? ' selected' : ''}>${timeLabel(t)}</option>`).join('')}</select></label></div>` : ''}`;
  }
  function renderAccount() {
    const real = APP && APP.user;
    const u = real ? APP.user() : { name: S.protoName || 'Trev Connolly', email: 'trev@example.com' };
    const nudgeOn = real ? APP.nudgeOn() : !!S.protoNudge;
    const row = (act, title, sub) => `<button type="button" class="proj-row" data-act="${act}"><span class="proj-text"><strong>${title}</strong><small>${sub}</small></span><span class="chev">${ICON.chev}</span></button>`;
    let h = `<a class="proj-row rhythm-row" href="#rhythm"><span class="proj-text"><strong>Weekly rhythm</strong>
        <span class="rhythm-mini">${ALLDAYS.map((x) => `<span class="rm-row${THEMES[x] ? '' : ' is-free'}"><span class="rm-day">${x}</span>${themeIcon(x, 16)}<span class="rm-name">${esc(THEMES[x] ? THEMES[x].short : 'Free')}</span></span>`).join('')}</span></span><span class="chev">${ICON.chev}</span></a>`;
    h += row('projects', 'Projects', `${S.projects.length} ${S.projects.length === 1 ? 'project' : 'projects'}`);
    h += row('notif-page', 'Notifications', nudgeOn ? `Daily nudge at ${timeLabel(S.nudgeTime || '08:30')}` : 'Daily nudge off');
    h += row('account-page', 'Account', esc(u.name || u.email || 'Signed in'));
    h += real ? '<button type="button" class="ghost-btn" data-act="sign-out">Sign out</button>' : '<button type="button" class="ghost-btn" disabled>Sign out</button>';
    return slotHead('Settings') + '<div class="acct-page settings-list">' + h + '</div>';
  }

  function notifPage() {
    const real = APP && APP.user;
    return pageHead('Settings', 'close-sheet', 'Notifications') + '<div class="acct-page settings-list">' + (real ? APP.nudgeRows() : protoNudgeRows()) + '</div>';
  }

  function accountPage() {
    const real = APP && APP.user;
    const u = real ? APP.user() : { name: S.protoName || 'Trev Connolly', email: 'trev@example.com' };
    const name = sheet.nameDraft != null ? sheet.nameDraft : (u.name || '');
    return pageHead('Settings', 'close-sheet', 'Account') + `<form id="account-form" novalidate class="acct-form">
      <div class="field-group"><label for="acct-name">Name</label><input class="field" id="acct-name" value="${esc(name)}" autocomplete="name" placeholder="Your name">
        <p class="hint">Shown in Tackle, like “Good week, ${esc((name || 'you').split(' ')[0])}.”</p>${sheet.error ? `<p class="error">${esc(sheet.error)}</p>` : ''}</div>
      <div class="field-group"><p class="eyebrow">Email</p><p class="static-field">${esc(u.email || '')}</p><p class="hint">From your Google account. Sign in with a different Google account to use another email.</p></div>
      <div class="sheet-actions"><button type="submit" class="primary">Save</button></div></form>
      <section class="danger-zone"><h2 class="eyebrow">Delete account</h2>
        <p class="hint">Permanently erases your plan, projects, rhythm and notification settings, and removes your sign-in. This can’t be undone.</p>
        <button type="button" class="danger-outline" data-act="acct-del-ask">Delete account</button></section>`;
  }

  function confirmDeleteAccount() {
    return head('Delete your account?') + `<p class="hint">Everything in Tackle goes: tasks, projects, your weekly rhythm and the daily nudge. You can sign up again later, but it starts empty.</p>
      <div class="confirm-btns"><button type="button" class="ghost-btn" data-act="acct-del-keep">Keep it</button>
        <button type="button" class="danger-btn" data-act="acct-del">Delete</button></div>`;
  }

  // Summary: what got done this week, by project and by day, then the list.
  function renderSummary() {
    const mine = S.tasks.filter((t) => !t.next);
    const done = mine.filter((t) => t.status === 'done');
    const pct = mine.length ? Math.round((done.length / mine.length) * 100) : 0;
    const ord = (n) => n + (n % 100 >= 11 && n % 100 <= 13 ? 'th' : ['th', 'st', 'nd', 'rd'][n % 10] || 'th');
    let h = slotHead('Your progress', backBtn('Week', '', '#week'));
    h += heroHTML('summary');
    const open = mine.length - done.length, R = 45, C = 2 * Math.PI * R;
    h += `<section class="donut-card" aria-label="${pct}% of planned tasks done, ${open} open">
      <svg class="donut" viewBox="0 0 100 100" aria-hidden="true"><circle cx="50" cy="50" r="${R}" class="donut-rest"/>
        <circle cx="50" cy="50" r="${R}" class="donut-done" stroke-dasharray="${(C * pct / 100).toFixed(1)} ${C.toFixed(1)}" transform="rotate(-90 50 50)"/>
        <text x="50" y="50" text-anchor="middle" dominant-baseline="central" class="donut-pct">${pct}%</text></svg>
      <div class="donut-legend"><p><span class="key done"></span><strong>${done.length}</strong> done</p><p><span class="key open"></span><strong>${open}</strong> open ${open === 1 ? 'task' : 'tasks'}</p>
        <small>of ${mine.length} planned this week</small></div></section>`;
    // by project
    const projs = S.projects.map((p) => ({ name: p.name, d: done.filter((t) => t.tag === p.name).length, all: mine.filter((t) => t.tag === p.name).length })).filter((x) => x.all);
    const none = { name: '', d: done.filter((t) => !t.tag).length, all: mine.filter((t) => !t.tag).length };
    if (none.all) projs.push(none);
    projs.sort((a, b) => b.d - a.d || b.all - a.all);
    const maxP = Math.max(1, ...projs.map((x) => x.all));
    h += '<section class="sum-block" aria-labelledby="by-proj"><h2 class="eyebrow" id="by-proj">By project</h2><div class="bars">'
      + projs.map((x) => `<div class="bar-row">${tile(x.name, true)}<span class="bar-name">${esc(x.name || 'No project')}</span>
          <span class="bar-track" style="--all:${x.all / maxP};--done:${x.all ? x.d / maxP : 0}" aria-hidden="true"><i></i></span><span class="bar-num">${x.d}<small>/${x.all}</small></span></div>`).join('')
      + '</div></section>';
    // by day: just what got done
    const days = WEEKDAYS.map((d) => ({ d, done: done.filter((t) => t.day === d).length }));
    const maxD = Math.max(1, ...days.map((x) => x.done));
    h += `<section class="sum-block" aria-labelledby="by-day"><h2 class="eyebrow" id="by-day">By day</h2><div class="cols" style="--n:${days.length}">`
      + days.map((x) => `<div class="col${x.d === S.simDay ? ' is-today' : ''}"><span class="col-num">${x.done}</span>
          <span class="col-track" style="--done:${x.done / maxD}" aria-label="${FULL[x.d]}: ${x.done} done"><i></i></span>
          ${themeIcon(x.d, 16)}<span class="col-day">${x.d}</span></div>`).join('')
      + '</div></section>';
    // list: like All tasks, always filtered to done
    const sf = S.filters.sum || 'All', sd = S.sumDay || 'All';
    const list = done.filter((t) => (sf === 'All' || t.tag === sf) && (sd === 'All' || t.day === sd))
      .sort((a, b) => WEEKDAYS.indexOf(a.day) - WEEKDAYS.indexOf(b.day));
    h += `<section class="sum-block" aria-labelledby="done-list"><h2 class="eyebrow" id="done-list">Completed · ${list.length}</h2>`;
    h += '<div class="dd-row">' + dayDD('sum-day', sd) + projDD('sum') + '</div>';
    h += '<div class="wcards">';
    if (!list.length) h += `<p class="quiet-note">${done.length ? 'Nothing done matches these filters.' : 'Nothing finished yet this week. Wins land here.'}</p>`;
    h += list.map((t) => `<div class="wcard is-done-list">
        <button type="button" class="wcard-main" data-act="edit" data-id="${t.id}">${tile(t.tag, true)}
          <span class="wcard-text"><span>${esc(t.label)}</span><small>${t.repeat ? ICON.repeat : ''}${FULL[t.day]}</small></span></button>
        <button type="button" class="more" data-act="menu" data-id="${t.id}" aria-label="Options for ${esc(t.label)}">${ICON.more}</button></div>`).join('');
    return h + '</div></section>';
  }

  function renderRhythm() {
    const open = S.rhythmOpen || { [WEEKDAYS[0]]: true };
    let h = `<header class="head slotted"><div class="top-slot">${backBtn('Settings', '', '#settings')}</div><h1>Weekly rhythm</h1>
      <p class="lede">Give each day a theme, then say what kind of work belongs there. We’ll use these inputs to suggest when to tackle each new task.</p></header>`;
    h += '<div class="days rhythm">';
    for (const d of ALLDAYS) {
      const r = S.rhythm[d], th = THEMES[d], isOpen = !!open[d], off = r.key === 'off';
      const nTasks = S.tasks.filter((t) => t.day === d).length;
      const label = off ? 'Free' : th.name;
      h += `<section class="day ${isOpen ? 'is-open' : 'is-closed'}${off ? ' is-off' : ''}" aria-label="${FULL[d]}, ${esc(label)}">
        <button type="button" class="day-toggle" data-act="rh-toggle" data-val="${d}" aria-expanded="${isOpen}" aria-controls="rh-${d}">
          <span class="day-head"><span class="day-name"><span>${themeIcon(d)}<strong>${FULL[d]}</strong></span><small>${esc(label)}</small></span>
          <span class="day-right"><span class="chev-day">${ICON.chev}</span></span></span>
          ${!isOpen && !off && r.desc ? `<span class="day-sum"><span class="day-sum-text rh-sum">${esc(r.desc)}</span></span>` : ''}
        </button>`;
      if (isOpen) {
        h += `<div id="rh-${d}" class="day-body rh-body">
          <div class="field-group"><label class="eyebrow" for="rh-theme-${d}">Theme</label>
            <button type="button" class="rh-select" id="rh-theme-${d}" data-act="rh-pick" data-val="${d}" aria-haspopup="dialog">${off ? keyIcon('off', 'Free') : keyIcon(th.key, th.name)}<span class="rh-val">${esc(r.key === 'custom' ? 'Custom' : label)}</span><span class="dd-chev">${ICON.chev}</span></button></div>`;
        if (r.key === 'custom') h += `<div class="field-group"><label class="eyebrow" for="rh-name-${d}">Theme name</label><input class="field" id="rh-name-${d}" data-rh-name="${d}" value="${esc(r.name || '')}" autocomplete="off" placeholder="Kids’ activities, Shop orders, Studio day…"></div>`;
        if (off) h += `<p class="hint">Free days stay blank: no tasks land here and there’s no nudge.${nTasks ? ` ${nTasks} ${nTasks === 1 ? 'task is' : 'tasks are'} still on ${FULL[d]}; find ${nTasks === 1 ? 'it' : 'them'} in All tasks.` : ''}</p>`;
        else h += `<div class="field-group"><label class="eyebrow" for="rh-desc-${d}">What goes on ${FULL[d]}</label>
          <textarea class="area" id="rh-desc-${d}" data-rh-desc="${d}" rows="3" placeholder="The kinds of tasks that belong here, e.g. invoices, client calls, school forms, groceries">${esc(r.desc || '')}</textarea>
          <p class="hint">Tackle matches new tasks against these words.${d === wrapDay() && r.key === 'wrap' ? ' Your weekly Wrap happens on this day.' : ''}</p></div>`;
        h += '</div>';
      }
      h += '</section>';
    }
    return h + '</div>';
  }

  // Week headline follows the week: a send-off on day one, a nudge if nothing has started,
  // encouragement as things move, and a thank-you on the last day.
  function weekTitle() {
    const mine = S.tasks.filter((t) => thisWeek(t) && WEEKDAYS.includes(t.day));
    const done = mine.filter((t) => t.status === 'done').length;
    const moving = mine.filter((t) => t.status === 'doing').length + done;
    const pct = mine.length ? done / mine.length : 0;
    const d = S.simDay, first = WEEKDAYS[0], last = WEEKDAYS[WEEKDAYS.length - 1];
    if (d === last || !WEEKDAYS.includes(d) && ALLDAYS.indexOf(d) > ALLDAYS.indexOf(last)) return 'You did great';
    if (d === first) return 'Have a great week';
    if (mine.length && done === mine.length) return 'All done!';
    if (pct >= 0.75) return 'Almost done!';
    if (pct >= 0.5) return 'You’re on a roll!';
    if (moving) return 'Making progress';
    return 'Start strong';
  }

  function renderWeek() {
    const f = S.filters.week;
    let h = `<header class="head slotted"><div class="top-slot"><p class="eyebrow">${FULL[WEEKDAYS[0]]} ${fmt(dateOf(WEEKDAYS[0]))} – ${FULL[WEEKDAYS[WEEKDAYS.length - 1]]} ${fmt(dateOf(WEEKDAYS[WEEKDAYS.length - 1]))}</p></div><h1>${esc(weekTitle())}</h1></header>`;
    h += heroHTML('week');
    const allOpen = WEEKDAYS.every(dayOpen);
    h += `<div class="week-tools">${projDD('week')}<button type="button" class="text-btn" data-act="toggle-all">${allOpen ? 'Collapse all' : 'Expand all'}</button></div>`;
    h += '<div class="days" id="days">';
    for (const d of WEEKDAYS) {
      const th = THEMES[d];
      const ord = { doing: 0, todo: 1, done: 2 };
      const tasks = S.tasks.filter((t) => t.day === d && thisWeek(t) && (f === 'All' || t.tag === f)).sort((a, b) => ord[a.status] - ord[b.status]);
      const openT = tasks.filter((t) => t.status !== 'done');
      const waiting = openT.filter((t) => t.dep).length;
      const doneN = tasks.length - openT.length;
      const isOpen = dayOpen(d);
      const parts = [];
      if (!tasks.length) parts.push('Nothing planned');
      else {
        parts.push(openT.length ? `${openT.length} open ${openT.length === 1 ? 'task' : 'tasks'}` : 'All done');
        if (waiting) parts.push(`${waiting} waiting`);
        if (doneN && openT.length) parts.push(`${doneN} done`);
      }
      const projs = [...new Set(openT.map((t) => t.tag))];
      const icons = projs.slice(0, 5).map((g) => tile(g, true)).join('') + (projs.length > 5 ? `<span class="more-n">+${projs.length - 5}</span>` : '');
      h += `<section class="day ${S.simDay === d ? 'is-today' : ''}${isPast(d) ? ' is-past' : ''} ${isOpen ? 'is-open' : 'is-closed'}" data-day="${d}" data-zone="${d}" aria-label="${FULL[d]}, ${esc(th.name)}">
        <button type="button" class="day-toggle" data-act="toggle-day" data-val="${d}" aria-expanded="${isOpen}" aria-controls="day-${d}">
          <span class="day-head">
            <span class="day-name"><span>${themeIcon(d)}<strong>${FULL[d]}</strong></span><small>${esc(th.name)}</small></span>
            <span class="day-right">${S.simDay === d ? '<span class="pill">Today</span>' : `<span class="day-date">${fmt(dateOf(d))}</span>`}<span class="chev-day">${ICON.chev}</span></span>
          </span>
          <span class="day-sum"><span class="day-sum-text">${parts.join(' · ')}</span></span>
        </button>`;
      if (isOpen) {
        h += `<div id="day-${d}" class="day-body">`;
        if (tasks.length) {
          h += '<div class="wcards">' + tasks.map((t) => {
            const cls = (t.home ? ' moved' : '') + (t.status === 'done' ? ' is-done' : '') + (t.status === 'doing' ? ' is-doing' : '');
            const sub = t.status === 'doing' ? 'In progress' : t.home ? 'usually ' + t.home : t.repeat ? 'Every week' : '';
            return `<div class="wcard${cls}" data-drag="${t.id}" data-ctx="week">
              <button type="button" class="wcard-main" data-act="edit" data-id="${t.id}">${tile(t.tag, true)}
                <span class="wcard-text"><span>${esc(t.label)}</span>${sub ? `<small>${t.repeat && !t.home && t.status !== 'doing' ? ICON.repeat : ''}${sub}</small>` : ''}</span></button>
              <button type="button" class="more" data-act="menu" data-id="${t.id}" aria-label="Options for ${esc(t.label)}">${ICON.more}</button></div>`;
          }).join('') + '</div>';
        } else {
          h += `<p class="empty-day">Nothing here${f === 'All' ? '' : ' for ' + esc(f)}.</p>`;
        }
        h += '</div>';
      }
      h += '</section>';
    }
    const offs = ALLDAYS.filter((x) => !THEMES[x]);
    h += (offs.length ? `<section class="day off-col" aria-label="Free days"><p class="off">${offs.join(', ')} · Free</p></section>` : '') + '</div>';
    const nx = S.tasks.filter((t) => t.next && (f === 'All' || t.tag === f)).length;
    if (nx) h += `<a class="next-link" href="#all" data-act="see-next">${nx} ${nx === 1 ? 'task' : 'tasks'} set for next week${ICON.chev}</a>`;
    return h;
  }

  // Day picking: a project's tasks go to the day you last put them on (learned from moves and edits).
  // A theme that spans days (Client: Tue + Wed) picks the lighter one. New projects and no project: Monday.
  // A day that has already gone by this week. Tasks placed on it go to next week (t.next).
  function isPast(day) {
    if (APP && S.weekOf && new Date(S.weekOf + 'T00:00:00') > thisMonday()) return false; // week closed early: we're planning next week
    const ti = ALLDAYS.indexOf(S.simDay);
    return ALLDAYS.indexOf(day) < ti;
  }
  const thisWeek = (t) => !t.next;
  const openOn = (d) => S.tasks.filter((t) => t.day === d && !t.next && t.status !== 'done').length;
  const ahead = (d) => { const i = ALLDAYS.indexOf(S.simDay); return (ALLDAYS.indexOf(d) - i + 7) % 7; };
  function dayForProject(tag) {
    const p = tag && S.projects.find((x) => x.name === tag);
    const base = (p && THEMES[p.day] && p.day) || WEEKDAYS[0];
    const twins = WEEKDAYS.filter((d) => THEMES[d].key === THEMES[base].key);
    if (!p || twins.length < 2) return base;
    return twins.slice().sort((a, b) => isPast(a) - isPast(b) || openOn(a) - openOn(b) || ahead(a) - ahead(b))[0];
  }
  // Simple matching (no AI yet): words in the task name vs. what the person wrote under each day.
  const STOP = new Set(['the', 'and', 'for', 'with', 'from', 'into', 'about', 'this', 'that', 'next', 'week', 'day', 'get', 'make', 'send', 'call', 'do', 'new', 'my', 'our', 'your', 'some', 'out', 'up', 'any', 'all', 'things', 'stuff', 'work', 'tasks', 'like', 'update', 'updates', 'finish', 'start', 'check', 'today', 'tomorrow']);
  const stems = (txt) => (txt || '').toLowerCase().replace(/[’']/g, '').split(/[^a-z0-9]+/).filter((w) => w.length >= 3 && !STOP.has(w)).map((w) => w.replace(/(ies)$/, 'y').replace(/(es|s)$/, ''));
  const near = (a, b) => a === b || (a.length >= 4 && b.length >= 4 && (a.startsWith(b) || b.startsWith(a)));
  function matchDay(label) {
    const words = stems(label);
    if (!words.length) return null;
    let best = [], top = 0;
    for (const d of WEEKDAYS) {
      const pool = stems(THEMES[d].desc + ' ' + THEMES[d].name);
      const score = words.filter((w) => pool.some((x) => near(w, x))).length;
      if (score > top) { top = score; best = [d]; } else if (score && score === top) best.push(d);
    }
    if (!top) return null;
    return best.sort((a, b) => isPast(a) - isPast(b) || openOn(a) - openOn(b) || ahead(a) - ahead(b))[0];
  }
  function autoDay(label, tag) {
    const p = tag && S.projects.find((x) => x.name === tag);
    if (p && THEMES[p.day]) return dayForProject(tag);
    const m = matchDay(label + ' ' + (tag || ''));
    if (m) return m;
    return WEEKDAYS.find((d) => THEMES[d].key === 'plan') || WEEKDAYS[0];
  }
  const landsHTML = (day) => `${themeIcon(day)}<span><strong>${FULL[day]}</strong>${isPast(day) ? ', next week' : ` · ${esc(THEMES[day].name)}`}</span><button type="button" class="text-btn" data-act="day-open">Change</button>`;

  function learn(tag, day) {
    const p = tag && S.projects.find((x) => x.name === tag);
    if (p && THEMES[day]) p.day = day;
  }
  function suggestDay(t) { return t.tag ? dayForProject(t.tag) : t.day; }
  const carryOf = (t) => (S.carry[t.id] = S.carry[t.id] || {});
  const carryDay = (t) => carryOf(t).day || suggestDay(t);
  const looseTasks = () => S.tasks.filter((t) => !t.repeat && !t.next && t.status !== 'done');

  function wrapStepper(n) {
    const names = ['This week', 'Next week', 'Confirm'];
    const back = n > 1
      ? `<button type="button" class="wrap-back" data-act="wrap-step" data-val="${n - 1}">${ICON.back}Back</button>`
      : `<a class="wrap-back" href="#today">${ICON.back}Back</a>`;
    return `<div class="stepper" aria-label="Step ${n} of 3: ${names[n - 1]}">${back}
      <div class="step-bars" aria-hidden="true">${names.map((_, i) => `<span class="${i < n ? 'on' : ''}"></span>`).join('')}</div>
      <p class="eyebrow">Step ${n} of 3 · ${names[n - 1]}</p></div>`;
  }
  function wrapNav(n, nextLabel) {
    return `<div class="wrap-nav">${n > 1 ? `<button type="button" class="ghost-btn" data-act="wrap-step" data-val="${n - 1}">Back</button>` : ''}
      <button type="button" class="primary" data-act="${n === 3 ? 'close-week' : 'wrap-step'}" data-val="${n + 1}">${nextLabel}</button></div>`;
  }

  function renderWrap() {
    const d = S.simDay;
    const date = d === wrapDay() ? FULL[wrapDay()] + ' · ' + fmt(dateOf(wrapDay())) : 'Preview · Wrap is for ' + FULL[wrapDay()] + 's';
    const ord = (n) => n + (n % 100 >= 11 && n % 100 <= 13 ? 'th' : ['th', 'st', 'nd', 'rd'][n % 10] || 'th');
    if (S.closed) {
      const c = S.closed;
      return `<header class="head"><p class="eyebrow">${esc(date)}</p><h1>Week closed</h1>
        <p class="lede">You earned the weekend.</p></header>
        <section class="hero"><div class="hero-big"><strong>${c.wins}</strong><span>${c.wins === 1 ? 'Task' : 'Tasks'} done<br>this week</span></div>
        <p class="hero-foot">${c.wins} ${c.wins === 1 ? 'win' : 'wins'} banked · ${c.rolled} carried to next week${c.dropped ? ` · ${c.dropped} removed` : ''}</p></section>
        <button type="button" class="primary" data-act="dismiss-closed">See next week</button>`;
    }
    const n = Math.min(S.wrapStep || 1, 3);
    let h = wrapStepper(n);
    const done = S.tasks.filter((t) => t.status === 'done');

    if (n === 1) {
      h += `<header class="head"><p class="eyebrow">${esc(date)}</p><h1>${done.length ? (firstName() ? `Good week, ${esc(firstName())}.` : 'Good week.') : 'The week so far'}</h1>
        <p class="lede">${done.length ? 'Look at what you moved forward.' : 'Wins land here as you finish things.'}</p></header>`;
      h += heroHTML('wrap');
      if (done.length) {
        h += '<section class="wins" aria-labelledby="wins-h"><div class="wins-head"><h2 id="wins-h">Completed</h2></div>';
        h += done.map((t) => `<div class="win">${tile(t.tag, true)}<span>${esc(t.label)}</span></div>`).join('') + '</section>';
      }
      h += `<section class="prompts">
        <div class="field-group"><label for="n-proud">What are you proud of this week?</label><textarea class="area" id="n-proud" data-note="proud" rows="3">${esc(S.notes.proud)}</textarea></div>
        <div class="field-group"><label for="n-better">What did you get better at?</label><textarea class="area" id="n-better" data-note="better" rows="3">${esc(S.notes.better)}</textarea></div></section>`;
      h += wrapNav(1, 'Next: Next week');
    }

    if (n === 2) {
      const loose = looseTasks();
      const kept = loose.filter((t) => !carryOf(t).removed);
      const removed = loose.filter((t) => carryOf(t).removed);
      h += `<header class="head"><p class="eyebrow">${esc(date)}</p><h1>Next week</h1>
        <p class="lede">Everything unfinished moves to next week. Each task gets a suggested day; change it or remove what you’re done with.</p></header>`;
      h += '<section class="carry" aria-label="Moving to next week">';
      if (!loose.length) h += '<p class="quiet-note">Nothing unfinished. Next week starts clean.</p>';
      h += kept.map((t) => {
        const c = carryOf(t);
        const day = carryDay(t);
        return `<div class="carry-row">${tile(t.tag, true)}
          <span class="carry-text"><span>${esc(t.label)}</span>${t.dep ? `<small>Waiting on: ${esc(t.dep)}</small>` : (day === suggestDay(t) && !c.day ? '<small>Suggested day</small>' : '')}</span>
          <button type="button" class="x-btn" data-act="carry-x" data-id="${t.id}" aria-label="Remove ${esc(t.label)} from next week">${ICON.close}</button>
          <label class="day-pick"><span class="sr-only">Day for ${esc(t.label)}</span>
            <select data-carry="${t.id}">${WEEKDAYS.map((w) => `<option value="${w}"${w === day ? ' selected' : ''}>${w}</option>`).join('')}</select></label></div>`;
      }).join('');
      if (removed.length) {
        h += '<div class="removed-list"><p class="eyebrow">Removed</p>' + removed.map((t) =>
          `<div class="removed-row"><span>${esc(t.label)}</span><button type="button" class="text-btn" data-act="carry-undo" data-id="${t.id}">Undo</button></div>`).join('') + '</div>';
      }
      h += '</section>';
      h += `<div class="field-group"><label for="n-next">What should next week start with?</label><textarea class="area" id="n-next" data-note="next" rows="2">${esc(S.notes.next)}</textarea></div>`;
      h += wrapNav(2, 'Next: Confirm');
    }

    if (n === 3) {
      h += `<header class="head"><p class="eyebrow">${esc(date)}</p><h1>The plan</h1>
        <p class="lede">Here’s next week. Close the week to lock it in.</p></header>`;
      if (S.notes.next.trim()) h += `<section class="next-card"><p class="eyebrow">Start with</p><p>${esc(S.notes.next.trim())}</p></section>`;
      const loose = looseTasks().filter((t) => !carryOf(t).removed);
      h += '<section class="plan-list">';
      for (const w of WEEKDAYS) {
        const rec = S.tasks.filter((t) => t.repeat && (t.home || t.day) === w);
        const car = loose.filter((t) => carryDay(t) === w);
        const nxt = S.tasks.filter((t) => t.next && !t.repeat && t.status !== 'done' && t.day === w);
        h += `<div class="plan-day" data-zone="${w}"><div class="plan-day-head">${themeIcon(w)}<strong>${FULL[w]}</strong><small>${esc(THEMES[w].name)}</small></div>`;
        if (!rec.length && !car.length && !nxt.length) h += '<p class="quiet-note">Nothing yet.</p>';
        const card = (t, cls, sub) => `<div class="wcard${cls}" data-drag="${t.id}" data-ctx="plan"><div class="wcard-main">${tile(t.tag, true)}
          <span class="wcard-text"><span>${esc(t.label)}</span><small>${sub}</small></span></div>
          <button type="button" class="more" data-act="menu" data-ctx="plan" data-id="${t.id}" aria-label="Options for ${esc(t.label)}">${ICON.more}</button></div>`;
        const items = S.tasks.filter((t) => car.includes(t) || rec.includes(t) || nxt.includes(t));
        if (items.length) h += '<div class="wcards">' + items.map((t) => car.includes(t) ? card(t, ' moved', 'Carried over') : nxt.includes(t) ? card(t, '', 'Added for next week') : card(t, '', ICON.repeat + 'Every week')).join('') + '</div>';
        h += '</div>';
      }
      h += '</section>';
      h += wrapNav(3, 'Close the week');
    }
    return h;
  }

  function renderProto() {
    return `<span class="proto-tag">Prototype</span>
      <div class="proto-group" role="group" aria-label="Pretend today is">${ALLDAYS.map((d) =>
        `<button type="button" data-act="sim-day" data-val="${d}" aria-pressed="${S.simDay === d}">${d}</button>`).join('')}</div>
      <div class="proto-wide">
        <button type="button" data-act="notify">Preview notification</button>
        <div class="proto-group" role="group" aria-label="Notification copy">
          <button type="button" data-act="copy" data-val="plain" aria-pressed="${S.notifCopy === 'plain'}">Plain</button>
          <button type="button" data-act="copy" data-val="theme" aria-pressed="${S.notifCopy === 'theme'}">Theme-aware</button>
        </div>
        <button type="button" data-act="reset">${resetArmed ? 'Tap again to reset' : 'Reset data'}</button>
      </div>`;
  }

  /* ---------- Sheets ---------- */
  function renderSheet() {
    const root = $('#sheet');
    if (!sheet) { root.hidden = true; root.innerHTML = ''; return; }
    let body = '';
    if (sheet.kind === 'task') body = taskSheet();
    else if (sheet.kind === 'menu') body = menuSheet();
    else if (sheet.kind === 'status') body = statusSheet();
    else if (sheet.kind === 'confirm-remove') body = confirmRemoveSheet();
    else if (sheet.kind === 'project') body = projectSheet();
    else if (sheet.kind === 'projects') body = projectsSheet();
    else if (sheet.kind === 'theme') body = themeSheet();
    else if (sheet.kind === 'account-page') body = accountPage();
    else if (sheet.kind === 'notif-page') body = notifPage();
    else if (sheet.kind === 'confirm-account') body = confirmDeleteAccount();
    else if (sheet.kind === 'confirm-project') body = confirmProjectSheet();
    else if (sheet.kind === 'account') body = APP.accountSheet(head, esc);
    else body = planSheet();
    root.innerHTML = `<button type="button" class="scrim" data-act="close-sheet" aria-label="Close" tabindex="-1"></button>
      <div class="sheet${sheet.kind === 'task' || sheet.page ? ' is-page' : ''}" role="dialog" aria-modal="true" aria-labelledby="sheet-h">${sheet.kind === 'task' || sheet.page ? '' : '<span class="grab" aria-hidden="true"></span>'}${body}</div>`;
    root.hidden = false;
    if (sheet.kind === 'status' || (sheet.kind === 'task' && sheet.mode === 'edit')) bindSlider();
  }

  function head(title) {
    return `<div class="sheet-head"><h2 id="sheet-h">${title}</h2><button type="button" class="icon-btn" data-act="close-sheet" aria-label="Close">${ICON.close}</button></div>`;
  }

  function taskSheet() {
    const D = sheet.draft, isEdit = sheet.mode === 'edit';
    const naming = !isEdit || sheet.renaming;
    let h = `<div class="page-top"><button type="button" class="icon-btn back-x" data-act="close-sheet" aria-label="Close without saving">${ICON.close}</button></div>`;
    h += '<form id="task-form" novalidate class="task-page">';
    h += `<header class="task-head"><p class="eyebrow" id="sheet-h">${isEdit ? 'Edit task' : 'New task'}</p>`;
    if (naming) {
      h += `<label class="sr-only" for="f-label">Task name</label><textarea class="title-input" id="f-label" rows="2" autocomplete="off" placeholder="What needs doing?">${esc(D.label)}</textarea>`;
    } else {
      h += `<h1 class="task-title">${esc(D.label)}</h1><button type="button" class="text-btn rename" data-act="rename">Change task name</button>`;
    }
    if (sheet.error) h += `<p class="error">${sheet.error}</p>`;
    h += '</header>';
    h += `<div class="field-group"><p class="eyebrow" id="proj-lbl">Project${isEdit ? '' : ' · optional'}</p>
      <div class="dd">
        <button type="button" class="dd-btn" data-act="proj-toggle" aria-haspopup="listbox" aria-expanded="${!!sheet.projOpen}" aria-labelledby="proj-lbl proj-cur">
          ${tile(D.tag)}<span id="proj-cur" class="dd-val${D.tag ? '' : ' is-empty'}">${D.tag ? esc(D.tag) : 'No project'}</span><span class="dd-chev">${ICON.chev}</span></button>
        ${sheet.projOpen ? `<div class="dd-list" role="listbox" aria-labelledby="proj-lbl">
          <button type="button" role="option" class="dd-opt" data-act="d-tag" data-val="" aria-selected="${!D.tag}"><span class="ptile sm dashed"></span><span>No project</span>${!D.tag ? `<span class="dd-check">${ICON.tick}</span>` : ''}</button>${S.projects.map((p) =>
          `<button type="button" role="option" class="dd-opt" data-act="d-tag" data-val="${esc(p.name)}" aria-selected="${D.tag === p.name}"><span class="ptile sm">${picon(p.icon, 14)}</span><span>${esc(p.name)}</span>${D.tag === p.name ? `<span class="dd-check">${ICON.tick}</span>` : ''}</button>`).join('')}
          <button type="button" class="dd-opt dd-new" data-act="new-project"><span class="ptile sm dashed"><svg aria-hidden="true" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></span><span>New project</span></button>
          <button type="button" class="dd-opt dd-manage" data-act="projects"><span class="ptile sm dashed">${ICON.edit}</span><span>Manage projects</span></button></div>` : ''}
      </div></div>`;
    if (isEdit) {
      h += `<div class="field-group"><p class="eyebrow">Status</p>${sliderHTML(D.status)}</div>`;
    }
    h += `<div class="field-group"><label class="eyebrow" for="f-notes">Notes${isEdit ? '' : ' · optional'}</label><textarea class="area" id="f-notes" rows="4" placeholder="Links, details, what done looks like…">${esc(D.notes || '')}</textarea></div>`;
    // Day: the suggested-day box on both New and Edit; Change opens the full list.
    if (!sheet.dayOpen) {
      h += `<div class="field-group"><p class="eyebrow" id="lands-lbl">Scheduled for</p><p class="lands" id="lands" aria-labelledby="lands-lbl">${landsHTML(D.day)}</p></div>`;
      if (isEdit && D.repeat && sheet.origDay !== D.day) h += `<p class="hint">Moves it to ${FULL[D.day]}s in your weekly plan.</p>`;
    } else {
    h += '<div class="field-group"><p class="eyebrow" id="day-lbl">Day</p><div class="day-list" role="radiogroup" aria-labelledby="day-lbl">' + WEEKDAYS.map((d) => {
      const on = D.day === d;
      return `<div class="day-opt${on ? ' is-on' : ''}">
        <button type="button" role="radio" aria-checked="${on}" class="day-pick-btn" data-act="d-day" data-val="${d}"><strong>${FULL[d]}</strong><span>${esc(THEMES[d].name)}${isPast(d) && !(isEdit && d === byId(sheet.id).day && !byId(sheet.id).next) ? ' · next week' : ''}</span></button>
      </div>`;
    }).join('') + '</div>';
    if (isEdit && D.repeat && sheet.origDay !== D.day) h += `<p class="hint">Moves it to ${FULL[D.day]}s in your weekly plan.</p>`;
    h += '</div>';
    }

    h += `<div class="field-group"><p class="eyebrow" id="rep-lbl">Repeats</p><div class="seg" style="grid-template-columns:repeat(2,minmax(0,1fr))" role="group" aria-labelledby="rep-lbl">
      <button type="button" data-act="d-repeat-set" data-val="0" aria-pressed="${!D.repeat}">One-time</button>
      <button type="button" data-act="d-repeat-set" data-val="1" aria-pressed="${!!D.repeat}">${ICON.repeatL}Recurring</button></div>
      ${D.repeat ? `<p class="hint">Comes back every ${FULL[D.day]}.</p>` : ''}</div>`;
    if (isEdit) {
      if (D.dep) {
        h += `<div class="hold-card" role="status"><span class="hold-ico">${ICON.link}</span>
          <p><span class="eyebrow">On hold</span><span>Waiting on: <b>${esc(D.dep)}</b></span></p>
          <button type="button" class="ghost-btn small" data-act="d-hold-remove">Remove hold</button></div>`;
      } else if (sheet.holdOpen) {
        h += `<div class="hold-form"><label class="eyebrow" for="f-dep">Waiting on</label>
          <input class="field" id="f-dep" value="${esc(sheet.depDraft || '')}" autocomplete="off" placeholder="Feedback, files, a signature…">
          <div class="hold-btns"><button type="button" class="ghost-btn small" data-act="d-hold-cancel">Cancel</button></div>
          <p class="hint">Saving puts it on hold.</p></div>`;
      } else h += '<button type="button" class="text-btn hold-link" data-act="d-hold-open">Put on hold for dependency</button>';
    }
    h += `<div class="sheet-actions"><button type="submit" class="primary">Save</button></div></form>`;
    return h;
  }

  function menuSheet() {
    const t = byId(sheet.id);
    if (!t) return head('Task not found');
    const closeBtn = `<button type="button" class="icon-btn" data-act="close-sheet" aria-label="Close">${ICON.close}</button>`;
    if (sheet.step !== 'move') {
      const doneLabel = t.status === 'done' ? 'Mark as to do' : 'Mark as done';
      return `<div class="sheet-head"><div class="preview-chip">${tile(t.tag)}<h2 id="sheet-h">${esc(t.label)}</h2></div>${closeBtn}</div>
        <div class="menu-list">
        <button type="button" data-act="menu-move">${ICON.arrow}Move to another day<span class="chev">${ICON.chev}</span></button>
        <button type="button" data-act="menu-edit">${ICON.edit}Edit task</button>
        <button type="button" data-act="menu-done">${ICON.check}${doneLabel}</button>
        <button type="button" class="danger" data-act="menu-delete">${ICON.trash}Delete task</button></div>`;
    }
    const curDay = sheet.plan ? (t.repeat ? (t.home || t.day) : carryDay(t)) : t.day;
    let h = `<div class="sheet-head"><div class="preview-chip"><button type="button" class="back-btn" data-act="menu-back" aria-label="Back">${ICON.back}</button><h2 id="sheet-h" class="move-title">Move “${esc(t.label)}”</h2></div>${closeBtn}</div>`;
    h += '<div class="field-group"><p class="eyebrow">Move to</p><div class="targets" role="group" aria-label="Move to day">' + WEEKDAYS.map((d) => {
      const cur = d === curDay;
      return `<button type="button" class="${cur ? 'is-current' : ''}" data-act="m-day" data-val="${d}" aria-pressed="${sheet.to === d}"${cur ? ' aria-label="' + FULL[d] + ', current day"' : ''}>${themeIcon(d, 26)}<span class="t-day">${d}</span><span class="t-theme">${THEMES[d].short}</span></button>`;
    }).join('') + '</div></div>';
    const ready = sheet.to && sheet.to !== curDay;
    if (ready && t.repeat && !sheet.plan) {
      const wk = sheet.scope === 'week';
      h += `<div class="options" role="group" aria-label="How long">
        <button type="button" class="option" data-act="m-scope" data-val="week" aria-pressed="${wk}"><span class="radio"></span><span><strong>Just this week</strong><span>Back on ${t.home || t.day} next week.</span></span></button>
        <button type="button" class="option" data-act="m-scope" data-val="every" aria-pressed="${!wk}"><span class="radio"></span><span><strong>Every week</strong><span>Updates your weekly plan.</span></span></button></div>`;
    }
    const label = !ready ? 'Pick a day' : t.repeat && (sheet.scope === 'every' || sheet.plan) ? 'Move to ' + FULL[sheet.to] + 's' : 'Move to ' + FULL[sheet.to];
    h += `<button type="button" class="primary" data-act="do-move"${ready ? '' : ' disabled'}>${label}</button>`;
    return h;
  }

  const ORDER = ['todo', 'doing', 'done'];
  const sliderHTML = (status) => {
    const i = ORDER.indexOf(status);
    return `<div class="slider" id="status-slider" role="slider" tabindex="0" aria-label="Status" aria-valuemin="0" aria-valuemax="2" aria-valuenow="${i}" aria-valuetext="${STATUS[status]}" data-st="${status}" style="--pos:${i}">
        <span class="slider-stops" aria-hidden="true">${ORDER.map((k) => `<span><span class="stop-ico">${ICON[k === 'done' ? 'doneO' : k]}</span>${STATUS[k]}</span>`).join('')}</span>
        <span class="slider-thumb st-${status}" aria-hidden="true"></span>
        <span class="slider-stops on" aria-hidden="true">${ORDER.map((k) => `<span><span class="stop-ico">${ICON[k === 'done' ? 'doneO' : k]}</span>${STATUS[k]}</span>`).join('')}</span>
      </div>`;
  };
  function statusSheet() {
    const t = byId(sheet.id);
    if (!t) return head('Task not found');
    let h = `<div class="sheet-head"><h2 id="sheet-h">${esc(t.label)}</h2><button type="button" class="icon-btn" data-act="close-sheet" aria-label="Close">${ICON.close}</button></div>
      ${sliderHTML(t.status)}`;
    if (t.dep) {
      h += `<div class="hold-card" role="status"><span class="hold-ico">${ICON.link}</span>
        <p><span class="eyebrow">On hold</span><span>Waiting on: <b>${esc(t.dep)}</b></span></p>
        <button type="button" class="ghost-btn small" data-act="hold-remove">Remove hold</button></div>`;
    } else if (sheet.holdOpen) {
      h += `<form id="hold-form" class="hold-form" novalidate>
        <label class="eyebrow" for="f-hold">Waiting on</label>
        <input class="field" id="f-hold" value="${esc(sheet.holdText || '')}" autocomplete="off" placeholder="Feedback, files, a signature…">
        ${sheet.holdError ? `<p class="error">${sheet.holdError}</p>` : ''}
        <div class="hold-btns"><button type="button" class="ghost-btn small" data-act="hold-cancel">Cancel</button><button type="submit" class="primary small">Put on hold</button></div></form>`;
    } else {
      h += `<button type="button" class="text-btn hold-link" data-act="hold-open">Put on hold for dependency</button>`;
    }
    return h;
  }

  function bindSlider() {
    const el = $('#status-slider');
    if (!el) return;
    const onPage = sheet.kind === 'task';
    const t = onPage ? sheet.draft : byId(sheet.id);
    const thumb = el.querySelector('.slider-thumb');
    let start = ORDER.indexOf(t.status), pos = start, down = false, moved = false, x0 = 0;
    const geo = () => { const r = el.getBoundingClientRect(); return { left: r.left + 4, step: (r.width - 8) / 3 }; };
    const posAt = (x) => { const g = geo(); return Math.max(0, Math.min(2, (x - g.left) / g.step - 0.5)); };
    const paint = (p, live) => {
      el.style.setProperty('--pos', p);
      const k = ORDER[Math.round(p)];
      thumb.className = 'slider-thumb st-' + k; el.dataset.st = k;
      el.classList.toggle('dragging', !!live);
    };
    const commit = (idx) => {
      paint(idx, false);
      el.setAttribute('aria-valuenow', idx); el.setAttribute('aria-valuetext', STATUS[ORDER[idx]]);
      if (idx === start) return;
      try { navigator.vibrate && navigator.vibrate(12); } catch (e) {}
      t.status = ORDER[idx];
      if (onPage) { start = idx; return; }
      save();
      const msg = idx === 2 ? 'Moved to Done' : idx === 1 ? 'Moved to In progress' : 'Moved back to To do';
      setTimeout(() => { if (sheet && sheet.kind === 'status') { closeSheet(); render(); toast(msg); } }, 420);
      start = idx;
    };
    el.addEventListener('pointerdown', (e) => { down = true; moved = false; x0 = e.clientX; el.setPointerCapture(e.pointerId); });
    el.addEventListener('pointermove', (e) => {
      if (!down) return;
      if (!moved && Math.abs(e.clientX - x0) < 4) return;
      moved = true; pos = posAt(e.clientX); paint(pos, true);
    });
    const end = (e) => { if (!down) return; down = false; pos = moved ? pos : posAt(e.clientX); commit(Math.round(pos)); };
    el.addEventListener('pointerup', end);
    el.addEventListener('pointercancel', () => { down = false; paint(start, false); });
    el.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowRight' || e.key === 'ArrowUp') { e.preventDefault(); commit(Math.min(2, start + 1)); }
      if (e.key === 'ArrowLeft' || e.key === 'ArrowDown') { e.preventDefault(); commit(Math.max(0, start - 1)); }
    });
  }

  function confirmRemoveSheet() {
    const t = byId(sheet.id);
    if (!t) return head('Task not found');
    return `<div class="sheet-head"><h2 id="sheet-h">Remove from next week?</h2><button type="button" class="icon-btn" data-act="close-sheet" aria-label="Close">${ICON.close}</button></div>
      <div class="remove-task">${tile(t.tag)}<span>${esc(t.label)}</span></div>
      <p class="hint">It won’t carry over when you close the week. You can undo this on the Next week page.</p>
      <div class="confirm-btns"><button type="button" class="ghost-btn" data-act="carry-keep">Keep it</button>
        <button type="button" class="danger-btn" data-act="carry-remove">Remove</button></div>`;
  }

  // Full-page header for screens opened from Settings: a back link, then the big title.
  const pageHeadOld = (backLabel, backAct, title, eyebrow) => `<div class="page-head"><button type="button" class="wrap-back sub-back" data-act="${backAct}" aria-label="Back to ${backLabel}">${ICON.back}${backLabel}</button>
    <header class="head">${eyebrow ? `<p class="eyebrow">${eyebrow}</p>` : ''}<h1 id="sheet-h">${esc(title)}</h1></header></div>`;

  function projectsSheet() {
    let h = sheet.page ? pageHead('Settings', 'close-sheet', 'Projects') : (sheet.back ? `<div class="sheet-head"><div class="preview-chip"><button type="button" class="back-btn" data-act="sheet-back" aria-label="Back">${ICON.back}</button><h2 id="sheet-h">Projects</h2></div><button type="button" class="icon-btn" data-act="close-sheet" aria-label="Close">${ICON.close}</button></div>` : head('Projects'));
    h += '<div class="proj-list">';
    if (!S.projects.length) h += '<p class="quiet-note">No projects yet. Tasks don’t need one.</p>';
    h += S.projects.map((p, i) => {
      const n = S.tasks.filter((t) => t.tag === p.name).length;
      return `<button type="button" class="proj-row" data-act="project-edit" data-val="${i}">${tile(p.name)}<span class="proj-text"><strong>${esc(p.name)}</strong><small>${p.day ? 'Usually ' + FULL[p.day] : 'No usual day yet'} · ${n} ${n === 1 ? 'task' : 'tasks'}</small></span><span class="chev">${ICON.chev}</span></button>`;
    }).join('');
    h += '</div><button type="button" class="ghost-btn" data-act="project-new">New project</button>';
    return h;
  }

  // Keep an open task draft in step with a renamed or deleted project.
  function retagDrafts(start, from, to) {
    for (let x = start; x; x = x.back) if (x.kind === 'task' && x.draft && x.draft.tag === from) x.draft.tag = to;
  }

  function themeSheet() {
    const d = sheet.day, cur = S.rhythm[d].key;
    const opt = (key, name, desc) => `<button type="button" class="theme-opt" data-act="rh-set" data-val="${key}" aria-pressed="${cur === key}">${keyIcon(key, name, 20)}
      <span class="theme-text"><strong>${esc(name)}</strong>${desc ? `<small>${esc(desc)}</small>` : ''}</span>${cur === key ? `<span class="dd-check">${ICON.tick}</span>` : ''}</button>`;
    return head(FULL[d]) + '<div class="theme-list">' + opt('off', 'Free', 'A blank day. No tasks land here, no nudge.')
      + THEME_LIB.map((x) => opt(x.key, x.name, x.desc)).join('')
      + opt('custom', 'Custom', 'Name it yourself and describe what goes on this day.') + '</div>';
  }

  function confirmProjectSheet() {
    const p = S.projects[sheet.index];
    const n = S.tasks.filter((t) => t.tag === p.name).length;
    return head('Delete ' + esc(p.name) + '?') + `<div class="remove-task">${tile(p.name)}<span>${esc(p.name)}</span></div>
      <p class="hint">${n ? `Its ${n} ${n === 1 ? 'task stays' : 'tasks stay'} where they are, with no project.` : 'It has no tasks.'}</p>
      <div class="confirm-btns"><button type="button" class="ghost-btn" data-act="project-keep">Keep it</button>
        <button type="button" class="danger-btn" data-act="project-delete">Delete</button></div>`;
  }

  function projectSheet() {
    const P = sheet.draft, isEdit = sheet.index != null;
    let h = (sheet.page ? pageHead('Projects', 'project-cancel', isEdit ? (P.name || 'Project') : 'New project', isEdit ? 'Edit project' : '') : head(isEdit ? 'Edit project' : 'New project')) + '<form id="project-form" novalidate>';
    h += `<div class="field-group"><label for="p-name">Name</label><input class="field" id="p-name" value="${esc(P.name)}" autocomplete="off" placeholder="Client C, Garden, Portfolio…">
      ${sheet.error ? `<p class="error">${sheet.error}</p>` : ''}</div>`;
    h += '<div class="field-group"><p class="eyebrow">Icon</p><div class="icon-grid" role="group" aria-label="Icon">' +
      Object.keys(PICON).map((k) => `<button type="button" data-act="p-icon" data-val="${k}" aria-pressed="${P.icon === k}" aria-label="${k}">${picon(k, 22)}</button>`).join('') + '</div></div>';
    const pd = THEMES[P.day] ? P.day : null;
    h += '<div class="field-group"><p class="eyebrow" id="pday-lbl">Tasks fall on</p><div class="day-list" role="radiogroup" aria-labelledby="pday-lbl">'
      + WEEKDAYS.map((d) => `<div class="day-opt${pd === d ? ' is-on' : ''}"><button type="button" role="radio" aria-checked="${pd === d}" class="day-pick-btn" data-act="p-day" data-val="${d}">${themeIcon(d)}<strong>${FULL[d]}</strong><span>${esc(THEMES[d].name)}</span></button></div>`).join('')
      + `<div class="day-opt${!pd ? ' is-on' : ''}"><button type="button" role="radio" aria-checked="${!pd}" class="day-pick-btn" data-act="p-day" data-val="">${keyIcon('custom', 'Auto')}<strong>Let Tackle decide</strong></button></div>`
      + `</div><p class="hint">${pd ? `New ${esc(P.name || 'project')} tasks land on ${FULL[pd]}.` : 'Each new task goes to the day whose description matches its words best.'} Moving one of its tasks to another day updates this.</p></div>`;
    h += `<div class="sheet-actions"><button type="submit" class="primary">${isEdit ? 'Save' : 'Create project'}</button>
      ${isEdit ? '<button type="button" class="text-btn danger" data-act="project-del-ask">Delete project</button>' : ''}
      ${sheet.back && !sheet.page ? `<button type="button" class="text-btn" data-act="project-cancel">${sheet.back.kind === 'task' ? 'Back to task' : 'Back'}</button>` : ''}</div></form>`;
    return h;
  }

  function planSheet() {
    const prompts = ['What’s due this week?', 'What does done look like?', 'What are the steps?', 'What’s blocked?', 'Which day does each step go on?'];
    return head('Plan this week') +
      '<p class="hint">Walk the five questions, then drop each step onto a day.</p>' +
      '<ol class="prompt-list">' + prompts.map((p, i) => `<li><span>0${i + 1}</span>${p}</li>`).join('') + '</ol>' +
      `<div class="sheet-actions"><button type="button" class="primary" data-act="plan-add">Add a task</button>
      <button type="button" class="text-btn" data-act="go-week">Open the week</button></div>`;
  }

  function openSheet(s) {
    sheet = s; renderSheet();
    if (s.kind === 'task' && s.mode === 'add') { const f = $('#f-label'); if (f) f.focus(); }
  }
  function closeSheet() { sheet = null; renderSheet(); }

  /* ---------- Toast + notification ---------- */
  function toast(msg, undo) {
    const el = $('#toast');
    el.innerHTML = `<span>${esc(msg)}</span>${undo ? '<button type="button" data-act="undo">Undo</button>' : ''}`;
    el.hidden = false;
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => { el.hidden = true; }, undo ? 6000 : 3200);
  }

  function showNotif() {
    const d = S.simDay;
    if (!THEMES[d]) { toast('No notification on weekends.'); return; }
    const L = todayLists(d, 'All');
    let title, text;
    if (S.notifCopy === 'plain') { title = 'What do you want to tackle today?'; text = ''; }
    else {
      title = FULL[d] + ' · ' + THEMES[d].name;
      text = L.ready.length ? `${L.ready.length} ready${L.waiting.length ? `, ${L.waiting.length} waiting on something` : ''}.` : 'Nothing ready. Check what you’re waiting on.';
    }
    const el = $('#notif');
    el.innerHTML = `<span class="app-icon" aria-hidden="true">TACKLE</span>
      <span class="notif-body"><span class="notif-top"><b>Tackle</b><span>now</span></span>
      <span class="notif-title">${esc(title)}</span>${text ? `<span class="notif-text">${esc(text)}</span>` : ''}</span>`;
    el.setAttribute('aria-label', 'Notification: ' + title + (text ? '. ' + text : '') + '. Open Today.');
    el.hidden = false;
    clearTimeout(notifTimer);
    notifTimer = setTimeout(() => { el.hidden = true; }, 7000);
  }

  /* ---------- Actions ---------- */
  function closeWeek() {
    let wins = 0, rolled = 0, dropped = 0;
    const star = S.starred && byId(S.starred);
    const target = {};
    looseTasks().forEach((t) => { target[t.id] = carryDay(t); });
    S.tasks = S.tasks.filter((t) => {
      if (t.status === 'done') { wins++; if (!t.repeat) return false; }
      else if (!t.repeat) {
        if (carryOf(t).removed) { dropped++; return false; }
        if (target[t.id]) { t.day = target[t.id]; rolled++; }
      }
      if (t.repeat) t.status = 'todo';
      if (t.home) { t.day = t.home; t.home = null; }
      t.next = false;
      return true;
    });
    S.streak += 1;
    if (APP) { const n = new Date(thisMonday()); n.setDate(n.getDate() + 7); S.weekOf = isoDay(n); }
    S.closed = { wins, rolled, dropped, star: star ? star.label : null };
    S.starred = null; S.carry = {}; S.wrapStep = 1; S.notes = { proud: '', better: '', next: '' };
  }

  function commitTask() {
    const D = sheet.draft;
    const label = D.label.trim();
    if (!label) { sheet.error = 'Give the task a name.'; sheet.renaming = true; renderSheet(); $('#f-label').focus(); return; }
    const dep = (sheet.holdOpen && sheet.depDraft ? sheet.depDraft : D.dep || '').trim();
    const clean = { label, tag: D.tag, day: D.day, status: D.status, dep, repeat: D.repeat, notes: (D.notes || '').trim() };
    if (sheet.mode === 'edit') {
      const t = byId(sheet.id);
      if (t.day !== clean.day) { t.home = null; learn(clean.tag, clean.day); t.next = isPast(clean.day); }
      Object.assign(t, clean);
      toast('Saved');
    } else {
      if (sheet.dayTouched) learn(clean.tag, clean.day);
      const next = isPast(clean.day);
      S.tasks.push(Object.assign({ id: nid(), home: null, next }, clean));
      toast('Added to ' + FULL[clean.day] + (next ? ', next week' : ''));
    }
    save(); closeSheet(); render();
  }

  function doMove() {
    const t = byId(sheet.id), to = sheet.to;
    let msg;
    if (sheet.plan && !t.repeat) {
      carryOf(t).day = to; learn(t.tag, to);
      save(); closeSheet(); render(); toast(`${t.label} moves to ${FULL[to]} next week`); return;
    }
    if (sheet.plan) sheet.scope = 'every';
    if (t.repeat) {
      if (sheet.scope === 'week') {
        t.home = t.home || t.day;
        if (t.home === to) t.home = null;
        msg = `${t.label} moved to ${FULL[to]}, this week only`;
      } else {
        t.home = null;
        msg = `Plan updated: ${t.label} every ${FULL[to]}`;
      }
    } else msg = `${t.label} moved to ${FULL[to]}`;
    if (!t.repeat || sheet.scope !== 'week') learn(t.tag, to);
    t.day = to; t.next = isPast(to);
    if (t.next) msg = `${t.label} moved to ${FULL[to]}, next week`;
    save(); closeSheet(); render(); toast(msg);
  }

  document.addEventListener('click', (e) => {
    const el = e.target.closest('[data-act]');
    if (!el) return;
    const a = el.dataset.act, id = el.dataset.id, val = el.dataset.val;
    const t = id ? byId(id) : null;
    if (a !== 'reset' && resetArmed) { resetArmed = false; $('#proto').innerHTML = renderProto(); }
    switch (a) {
      case 'filter': S.filters[el.dataset.scope] = val; break;
      case 'all-day': S.allDay = val; break;
      case 'sum-day': S.sumDay = val; break;
      case 'account-page': openSheet({ kind: 'account-page', page: true }); return;
      case 'notif-page': openSheet({ kind: 'notif-page', page: true }); return;
      case 'acct-del-ask': openSheet({ kind: 'confirm-account', back: sheet }); return;
      case 'acct-del-keep': openSheet(sheet.back); return;
      case 'acct-del':
        if (APP && APP.deleteAccount) { APP.deleteAccount().catch((e) => toast('Couldn’t delete your account: ' + e.message)); return; }
        try { localStorage.removeItem(KEY); } catch (e) { /* ignore */ }
        S = seed(); applyRhythm(); closeSheet(); location.hash = 'today'; toast('Prototype: account deleted and data reset'); return;
      case 'proto-nudge': S.protoNudge = !S.protoNudge; if (S.protoNudge) toast('Daily nudge on (preview only)'); save(); if (sheet) renderSheet(); render(); return;
      case 'rh-pick': openSheet({ kind: 'theme', day: val }); return;
      case 'rh-set': {
        const d = sheet.day, lib = libTheme(val), prev = S.rhythm[d];
        if (prev.key !== val) S.rhythm[d] = { key: val, name: '', desc: lib ? lib.desc : '' };
        S.rhythmOpen = Object.assign(S.rhythmOpen || {}, { [d]: true });
        applyRhythm(); closeSheet(); save(); render();
        if (val === 'custom') { const n = $('#rh-name-' + d); if (n) n.focus(); }
        return;
      }
      case 'rh-toggle': { const o = S.rhythmOpen || { [WEEKDAYS[0]]: true }; o[val] = !o[val]; S.rhythmOpen = o; break; }
      case 'see-next': S.allDay = 'Next'; S.filters.all = S.filters.week; location.hash = 'all'; save(); return;
      case 'all-done': S.allDone = !S.allDone; break;
      case 'cycle': t.status = NEXT[t.status]; break;
      case 'status': openSheet({ kind: 'status', id }); return;
      case 'hold-open': sheet.holdOpen = true; renderSheet(); $('#f-hold').focus(); return;
      case 'hold-cancel': sheet.holdOpen = false; sheet.holdError = ''; renderSheet(); return;
      case 'hold-remove': { const m = byId(sheet.id); m.dep = ''; closeSheet(); toast('Hold removed. Back in Ready'); break; }
      case 'set-status': { const m = byId(sheet.id); m.status = val; closeSheet(); toast(m.status === 'done' ? 'Marked done' : m.status === 'doing' ? 'In progress' : 'Back to to do'); break; }
      case 'edit': openSheet({ kind: 'task', mode: 'edit', id, origDay: t.day, draft: { label: t.label, tag: t.tag, day: t.day, status: t.status, dep: t.dep, repeat: t.repeat, notes: t.notes || '' } }); return;
      case 'add': case 'plan-add': {
        const f = S.filters[view() === 'week' ? 'week' : view() === 'all' ? 'all' : 'today'];
        const tag = f && f !== 'All' && S.projects.some((p) => p.name === f) ? f : '';
        openSheet({ kind: 'task', mode: 'add', draft: { label: '', tag, day: autoDay('', tag), status: 'todo', dep: '', repeat: false, notes: '' } }); $('#f-label').focus(); return;
      }
      case 'day-open': sheet.dayOpen = true; renderSheet(); return;
      case 'd-status': sheet.draft.status = val; renderSheet(); return;
      case 'd-repeat-set': sheet.draft.repeat = val === '1'; renderSheet(); return;
      case 'd-hold-open': sheet.holdOpen = true; renderSheet(); $('#f-dep').focus(); return;
      case 'd-hold-cancel': sheet.holdOpen = false; sheet.depDraft = ''; renderSheet(); return;
      case 'd-hold-remove': sheet.draft.dep = ''; renderSheet(); return;
      case 'd-day': sheet.draft.day = val; sheet.dayTouched = true; sheet.dayOpen = false; renderSheet(); return;
      case 'd-tag': sheet.draft.tag = val; sheet.projOpen = false; if (sheet.mode === 'add' && !sheet.dayTouched) sheet.draft.day = autoDay(sheet.draft.label, val); renderSheet(); return;
      case 'proj-toggle': sheet.projOpen = !sheet.projOpen; renderSheet(); return;
      case 'd-repeat': sheet.draft.repeat = !sheet.draft.repeat; renderSheet(); return;
      case 'rename': sheet.renaming = true; renderSheet(); { const i = $('#f-label'); i.focus(); i.setSelectionRange(i.value.length, i.value.length); } return;
      case 'delete': {
        const i = S.tasks.indexOf(byId(sheet.id));
        lastDeleted = { task: S.tasks[i], i };
        S.tasks.splice(i, 1); save(); closeSheet(); render(); toast('Task deleted', true); return;
      }
      case 'undo':
        if (lastDeleted) { S.tasks.splice(lastDeleted.i, 0, lastDeleted.task); lastDeleted = null; $('#toast').hidden = true; }
        break;
      case 'menu': openSheet({ kind: 'menu', id, to: null, scope: 'week', plan: el.dataset.ctx === 'plan' }); return;
      case 'menu-move': sheet.step = 'move'; renderSheet(); return;
      case 'menu-back': sheet.step = null; sheet.to = null; renderSheet(); return;
      case 'm-day': sheet.to = val; renderSheet(); return;
      case 'm-scope': sheet.scope = val; renderSheet(); return;
      case 'do-move': doMove(); return;
      case 'menu-edit': { const m = byId(sheet.id); openSheet({ kind: 'task', mode: 'edit', id: m.id, origDay: m.day, draft: { label: m.label, tag: m.tag, day: m.day, status: m.status, dep: m.dep, repeat: m.repeat, notes: m.notes || '' } }); return; }
      case 'menu-done': { const m = byId(sheet.id); m.status = m.status === 'done' ? 'todo' : 'done'; closeSheet(); toast(m.status === 'done' ? 'Marked done' : 'Back to to do'); break; }
      case 'menu-delete': {
        const i = S.tasks.indexOf(byId(sheet.id));
        lastDeleted = { task: S.tasks[i], i };
        S.tasks.splice(i, 1); save(); closeSheet(); render(); toast('Task deleted', true); return;
      }
      case 'new-project': openSheet({ kind: 'project', back: sheet, draft: { name: '', icon: 'flag' } }); $('#p-name').focus(); return;
      case 'projects': openSheet(sheet ? { kind: 'projects', back: sheet.kind === 'task' || sheet.kind === 'account' ? sheet : null } : { kind: 'projects', page: true }); return;
      case 'sheet-back': openSheet(sheet.back); return;
      case 'project-new': openSheet({ kind: 'project', page: sheet.page, back: sheet, draft: { name: '', icon: 'flag' } }); $('#p-name').focus(); return;
      case 'project-edit': { const p = S.projects[+val]; openSheet({ kind: 'project', page: sheet.page, index: +val, back: sheet, draft: { name: p.name, icon: p.icon, day: p.day } }); return; }
      case 'project-del-ask': openSheet({ kind: 'confirm-project', index: sheet.index, back: sheet.back }); return;
      case 'project-keep': openSheet(sheet.back && sheet.back.kind === 'projects' ? sheet.back : { kind: 'projects', page: true }); return;
      case 'project-delete': {
        const p = S.projects[sheet.index];
        S.tasks.forEach((t) => { if (t.tag === p.name) t.tag = ''; });
        retagDrafts(sheet, p.name, '');
        ['today', 'week', 'all', 'sum'].forEach((k) => { if (S.filters[k] === p.name) S.filters[k] = 'All'; });
        S.projects.splice(sheet.index, 1);
        const back = sheet.back && sheet.back.kind === 'projects' ? sheet.back : { kind: 'projects', back: null };
        openSheet(back); toast(p.name + ' deleted'); break;
      }
      case 'p-icon': sheet.draft.icon = val; renderSheet(); return;
      case 'p-day': sheet.draft.day = val || null; renderSheet(); return;
      case 'project-cancel': openSheet(sheet.back); return;
      case 'close-sheet': closeSheet(); return;
      case 'plan': openSheet({ kind: 'plan' }); return;
      case 'go-week': closeSheet(); location.hash = 'week'; return;
      case 'toggle-done': S.showDone = !S.showDone; break;
      case 'star': S.starred = S.starred === id ? null : id; break;
      case 'wrap-step': S.wrapStep = +val; window.scrollTo({ top: 0 }); break;
      case 'carry-x': openSheet({ kind: 'confirm-remove', id }); return;
      case 'carry-keep': closeSheet(); return;
      case 'carry-remove': { const m = byId(sheet.id); carryOf(m).removed = true; closeSheet(); toast('Removed from next week', false); break; }
      case 'carry-undo': carryOf(t).removed = false; break;
      case 'go-wrap': location.hash = 'wrap'; return;
      case 'close-week': closeWeek(); window.scrollTo({ top: 0 }); break;
      case 'dismiss-closed': S.closed = null; if (!APP) S.simDay = 'Mon'; S.weekOpen = {}; if (APP) rollWeek(); location.hash = 'week'; break;
      case 'sim-day': S.simDay = val; S.showDone = false; S.weekOpen = {}; break;
      case 'toggle-day': S.weekOpen = Object.assign({}, S.weekOpen, { [val]: !dayOpen(val) }); break;
      case 'toggle-all': { const to = !WEEKDAYS.every(dayOpen); S.weekOpen = {}; WEEKDAYS.forEach((d) => { S.weekOpen[d] = to; }); break; }
      case 'copy': S.notifCopy = val; break;
      case 'notify': showNotif(); return;
      case 'account': openSheet({ kind: 'account' }); return;
      case 'sign-in': APP.signIn(); return;
      case 'sign-out': closeSheet(); APP.signOut(); return;
      case 'nudge-toggle': (APP.nudgeOn() ? APP.pushOff() : APP.pushOn(S.nudgeTime || '08:30')).then(() => { if (sheet) renderSheet(); render(); }); return;
      case 'notif-open': $('#notif').hidden = true; if (view() !== 'today') { location.hash = 'today'; return; } break;
      case 'reset':
        if (!resetArmed) { resetArmed = true; $('#proto').innerHTML = renderProto(); return; }
        resetArmed = false; S = seed(); closeSheet(); toast('Sample week restored'); break;
      default: return;
    }
    save(); render();
  });

  document.addEventListener('submit', (e) => {
    if (e.target.id === 'task-form') { e.preventDefault(); commitTask(); }
    if (e.target.id === 'project-form') { e.preventDefault(); commitProject(); }
    if (e.target.id === 'account-form') {
      e.preventDefault();
      const name = ($('#acct-name').value || '').trim();
      if (!name) { sheet.error = 'Add a name.'; renderSheet(); return; }
      if (APP && APP.updateName) APP.updateName(name).then(() => { closeSheet(); render(); toast('Name saved'); }).catch((err) => { sheet.error = err.message; renderSheet(); });
      else { S.protoName = name; save(); closeSheet(); render(); toast('Name saved'); }
    }
    if (e.target.id === 'hold-form') {
      e.preventDefault();
      const v = (sheet.holdText || '').trim();
      if (!v) { sheet.holdError = 'Say what it’s waiting on.'; renderSheet(); $('#f-hold').focus(); return; }
      const m = byId(sheet.id); m.dep = v; save(); closeSheet(); render(); toast('On hold: waiting on ' + v);
    }
  });

  function commitProject() {
    const P = sheet.draft, name = P.name.trim();
    if (!name) { sheet.error = 'Give the project a name.'; renderSheet(); $('#p-name').focus(); return; }
    if (S.projects.some((p, i) => i !== sheet.index && p.name.toLowerCase() === name.toLowerCase())) { sheet.error = 'You already have a project called ' + name + '.'; renderSheet(); $('#p-name').focus(); return; }
    if (sheet.index != null) {
      const p = S.projects[sheet.index], old = p.name;
      p.name = name; p.icon = P.icon; p.day = THEMES[P.day] ? P.day : null;
      if (old !== name) {
        S.tasks.forEach((t) => { if (t.tag === old) t.tag = name; });
        retagDrafts(sheet, old, name);
        ['today', 'week', 'all', 'sum'].forEach((k) => { if (S.filters[k] === old) S.filters[k] = name; });
      }
      save(); openSheet(sheet.back || { kind: 'projects' }); render(); toast('Project saved'); return;
    }
    S.projects.push({ name, icon: P.icon, day: THEMES[P.day] ? P.day : null });
    save();
    const back = sheet.back;
    if (back && back.kind === 'task') { back.draft.tag = name; back.projOpen = false; if (back.mode === 'add' && !back.dayTouched) back.draft.day = autoDay(back.draft.label, name); }
    openSheet(back || { kind: 'projects' }); render();
    toast('Project created');
  }

  document.addEventListener('input', (e) => {
    const el = e.target;
    if (el.dataset && el.dataset.rhName) { const d = el.dataset.rhName; S.rhythm[d].name = el.value; applyRhythm(); save(); const sm = el.closest('.day').querySelector('.day-name small'); if (sm) sm.textContent = THEMES[d].name; return; }
    if (el.dataset && el.dataset.rhDesc) { S.rhythm[el.dataset.rhDesc].desc = el.value; applyRhythm(); save(); return; }
    if (el.id === 'acct-name' && sheet) { sheet.nameDraft = el.value; return; }
    if (el.id === 'f-label' && sheet) {
      sheet.draft.label = el.value;
      if (sheet.mode === 'add' && !sheet.dayTouched) {
        const nd = autoDay(el.value, sheet.draft.tag);
        if (nd !== sheet.draft.day) { sheet.draft.day = nd; const l = $('#lands'); if (l) l.innerHTML = landsHTML(nd); }
      }
    }
    else if (el.id === 'f-dep' && sheet) { sheet.depDraft = el.value; }
    else if (el.id === 'p-name' && sheet) { sheet.draft.name = el.value; }
    else if (el.id === 'f-notes' && sheet) { sheet.draft.notes = el.value; }
    else if (el.id === 'f-hold' && sheet) { sheet.holdText = el.value; }
    else if (el.dataset && el.dataset.note) { S.notes[el.dataset.note] = el.value; save(); }
  });

  document.addEventListener('change', (e) => {
    const el = e.target;
    if (el.dataset && el.dataset.carry) { const t = byId(el.dataset.carry); if (t) { carryOf(t).day = el.value; learn(t.tag, el.value); save(); render(); } }
    if (el.dataset && el.dataset.dd) { const v = el.value, a = el.dataset.dd; if (a === 'filter') S.filters[el.dataset.scope] = v; else if (a === 'all-day') S.allDay = v; else if (a === 'sum-day') S.sumDay = v; save(); render(); }
    if (el.id === 'nudge-time') { S.nudgeTime = el.value; save(); render(); if (APP) APP.setNudgeTime(el.value); }
  });

  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape' && sheet) closeSheet();
    if (e.key === 'Enter' && e.target.id === 'f-label') { e.preventDefault(); }
  });
  window.addEventListener('hashchange', () => { render(); window.scrollTo({ top: 0 }); });

  let lastView = null, lastSimDay = null;
  // A filter can point at something that no longer exists (a renamed project, a day that went Free,
  // a value saved by an older version). The dropdown would show "All" while the list stays empty,
  // so anything that isn't a current option falls back to All.
  function cleanFilters() {
    S.filters = Object.assign({ today: 'All', week: 'All', all: 'All', sum: 'All' }, S.filters || {});
    const used = S.projects.filter((p) => S.tasks.some((t) => t.tag === p.name)).map((p) => p.name);
    for (const k of Object.keys(S.filters)) if (S.filters[k] !== 'All' && !used.includes(S.filters[k])) S.filters[k] = 'All';
    if (S.allDay !== 'All' && S.allDay !== 'Next' && !WEEKDAYS.includes(S.allDay)) S.allDay = 'All';
    if (S.sumDay !== 'All' && !WEEKDAYS.includes(S.sumDay)) S.sumDay = 'All';
  }
  function render() {
    const v = view();
    cleanFilters();
    if (APP) {
      $('#proto').hidden = true;
      if (APP.gate) { const g = APP.gate(); if (g) { $('#app').innerHTML = g; document.body.classList.add('is-gated'); return; } }
      document.body.classList.remove('is-gated');
    } else $('#proto').hidden = true;
    $('#app').innerHTML = v === 'today' ? renderToday() : v === 'week' ? renderWeek() : v === 'all' ? renderAll() : v === 'account' ? renderAccount() : v === 'rhythm' ? renderRhythm() : v === 'summary' ? renderSummary() : renderWrap();
    $('#app').classList.toggle('is-wrap', v === 'wrap');
    lastView = v; lastSimDay = S.simDay;
    document.querySelectorAll('.tab').forEach((tab) => {
      if (tab.dataset.v === v || (v === 'rhythm' && tab.dataset.v === 'account') || (v === 'summary' && tab.dataset.v === 'week')) tab.setAttribute('aria-current', 'page'); else tab.removeAttribute('aria-current');
    });
    $('#fab').hidden = v === 'wrap' || v === 'account' || v === 'rhythm' || v === 'summary';
  }

  // Tap and hold a Week or Plan card, then drag it to another day or another spot in a day.
  let press = null, drag = null, swallowClick = false;
  const HOLD_MS = 350;
  function clearMarks() {
    document.querySelectorAll('.drop-before, .drop-after, [data-zone].is-over').forEach((n) => n.classList.remove('drop-before', 'drop-after', 'is-over'));
  }
  function startDrag(card, x, y) {
    const r = card.getBoundingClientRect();
    const ghost = card.cloneNode(true);
    ghost.classList.remove('is-pressing'); ghost.classList.add('is-ghost');
    Object.assign(ghost.style, { left: r.left + 'px', top: r.top + 'px', width: r.width + 'px' });
    document.body.appendChild(ghost);
    card.classList.remove('is-pressing'); card.classList.add('is-dragging');
    document.body.classList.add('is-dragging-task');
    if (navigator.vibrate) navigator.vibrate(10);
    drag = { id: card.dataset.drag, ctx: card.dataset.ctx, card, ghost, dy: y - r.top, zone: null, target: null, after: false, x, y };
    const tick = () => {
      if (!drag) return;
      const edge = 110, vh = window.innerHeight;
      const v = drag.y < edge ? -(edge - drag.y) / 6 : drag.y > vh - edge ? (drag.y - (vh - edge)) / 6 : 0;
      if (v) { window.scrollBy(0, v); trackDrag(drag.x, drag.y); }
      requestAnimationFrame(tick);
    };
    requestAnimationFrame(tick);
  }
  function trackDrag(x, y) {
    drag.x = x; drag.y = y;
    drag.ghost.style.top = (y - drag.dy) + 'px';
    clearMarks();
    const el = document.elementFromPoint(x, y);
    const zone = el && el.closest('[data-zone]');
    let target = el && el.closest('.wcard[data-drag]');
    if (target === drag.card) target = null;
    drag.zone = zone; drag.target = target && zone && zone.contains(target) ? target : null;
    if (zone) zone.classList.add('is-over');
    if (drag.target) {
      const r = drag.target.getBoundingClientRect();
      drag.after = y > r.top + r.height / 2;
      drag.target.classList.add(drag.after ? 'drop-after' : 'drop-before');
    }
  }
  function endDrag(commit) {
    const d = drag; drag = null;
    clearMarks();
    document.body.classList.remove('is-dragging-task');
    d.ghost.remove(); d.card.classList.remove('is-dragging');
    if (!commit || !d.zone) return;
    const t = byId(d.id), to = d.zone.dataset.zone;
    let msg = '';
    if (d.ctx === 'plan' && !t.repeat) {
      if (carryDay(t) !== to) { carryOf(t).day = to; learn(t.tag, to); msg = `${t.label} moves to ${FULL[to]} next week`; }
    } else if (t.day !== to) {
      if (d.ctx === 'plan') { t.home = null; msg = `Plan updated: ${t.label} every ${FULL[to]}`; }
      else if (t.repeat) { t.home = t.home || t.day; if (t.home === to) t.home = null; msg = `${t.label} moved to ${FULL[to]}, this week only`; }
      else { msg = `${t.label} moved to ${FULL[to]}`; learn(t.tag, to); }
      if (d.ctx === 'plan') learn(t.tag, to);
      t.day = to;
      if (d.ctx !== 'plan') { t.next = isPast(to); if (t.next) msg = `${t.label} moved to ${FULL[to]}, next week`; }
    }
    if (d.target) {
      const tgt = byId(d.target.dataset.drag);
      S.tasks.splice(S.tasks.indexOf(t), 1);
      S.tasks.splice(S.tasks.indexOf(tgt) + (d.after ? 1 : 0), 0, t);
    }
    save(); render();
    if (msg) toast(msg);
  }
  document.addEventListener('pointerdown', (e) => {
    const card = e.target.closest && e.target.closest('.wcard[data-drag]');
    if (!card || e.button > 0 || e.target.closest('.more')) return;
    const x = e.clientX, y = e.clientY;
    card.classList.add('is-pressing');
    press = { card, x, y, timer: setTimeout(() => { press = null; swallowClick = true; startDrag(card, x, y); }, HOLD_MS) };
  });
  document.addEventListener('pointermove', (e) => {
    if (press && Math.hypot(e.clientX - press.x, e.clientY - press.y) > 8) { clearTimeout(press.timer); press.card.classList.remove('is-pressing'); press = null; }
    if (drag) { e.preventDefault(); trackDrag(e.clientX, e.clientY); }
  }, { passive: false });
  document.addEventListener('touchmove', (e) => { if (drag) e.preventDefault(); }, { passive: false });
  const release = (commit) => {
    if (press) { clearTimeout(press.timer); press.card.classList.remove('is-pressing'); press = null; }
    if (drag) { endDrag(commit); setTimeout(() => { swallowClick = false; }, 60); }
  };
  document.addEventListener('pointerup', () => release(true));
  document.addEventListener('pointercancel', () => release(false));
  document.addEventListener('contextmenu', (e) => { if (e.target.closest && e.target.closest('.wcard[data-drag]')) e.preventDefault(); });
  document.addEventListener('click', (e) => { if (swallowClick) { swallowClick = false; e.stopPropagation(); e.preventDefault(); } }, true);

  if (APP) {
    APP.getState = () => S;
    APP.setState = (next) => { S = next; applyRhythm(); S.carry = S.carry || {}; S.wrapStep = S.wrapStep || 1; S.simDay = realDay(); rollWeek(); try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) { /* ignore */ } if (!sheet) render(); };
    APP.fresh = freshState;
    APP.render = () => { if (sheet && /^(account|notif-page|account-page)$/.test(sheet.kind)) renderSheet(); render(); };
    APP.toast = toast;
    const tickDay = () => { const d = realDay(); const before = S.weekOf; S.simDay = d; rollWeek(); if (d !== lastSimDay || S.weekOf !== before) { save(); render(); } };
    document.addEventListener('visibilitychange', () => { if (!document.hidden) tickDay(); });
    window.addEventListener('focus', tickDay);
    setInterval(tickDay, 60000);
  }

  render();
})();
</script>

</body>
</html>
